name: Reusable WordPress Plugin CI

on:
  workflow_call:
    inputs:
      plugin-slug:
        description: 'Plugin directory name (defaults to repository name)'
        required: false
        type: string
        default: ''
      php-versions:
        description: 'PHP versions to test against'
        required: false
        type: string
        default: '["8.1", "8.2"]'
      wordpress-versions:
        description: 'WordPress versions to test against'
        required: false
        type: string
        default: '["6.6", "latest"]'
      node-version:
        description: 'Node version for building assets'
        required: false
        type: string
        default: '20'
      run-phpcs:
        description: 'Run PHP CodeSniffer'
        required: false
        type: boolean
        default: true
      run-php-compatibility:
        description: 'Run PHP Compatibility check'
        required: false
        type: boolean
        default: true
      run-unit-tests:
        description: 'Run PHPUnit tests'
        required: false
        type: boolean
        default: true
      run-security-check:
        description: 'Run security check'
        required: false
        type: boolean
        default: true
      run-release-check:
        description: 'Run release readiness check on PRs'
        required: false
        type: boolean
        default: true
      composer-repository-profile:
        description: "from-composer (default) = VCS repos derived from this plugin's composer.json; coding-standards-only; full = legacy kitchen-sink"
        required: false
        type: string
        default: 'from-composer'
      run-e2e:
        description: 'Run Playwright e2e (plugin must ship playwright.config.js and npm run test:e2e)'
        required: false
        type: boolean
        default: false
      run-wp-taint:
        description: 'Run wp-taint (plugin must ship wp-taint.toml; PHP 8.3 scanner job, plugin runtime stays 8.1)'
        required: false
        type: boolean
        default: false
    secrets:
      POLARIS_PLUGIN_GITHUB_TOKEN:
        required: false

env:
  PLUGIN_SLUG: ${{ inputs.plugin-slug || github.event.repository.name }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-lint:
    name: PHP Lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ${{ fromJson(inputs.php-versions) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: PHP Lint
        run: find . -name "*.php" -not -path "./vendor/*" -not -path "./node_modules/*" -print0 | xargs -0 -n1 -P8 php -l

  php-tests:
    if: inputs.run-unit-tests
    name: PHP Tests
    runs-on: ubuntu-latest
    needs: php-lint
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJson(inputs.php-versions) }}
        wordpress-version: ${{ fromJson(inputs.wordpress-versions) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, mysqli, pdo_mysql, bcmath, soap, intl, gd, exif, iconv
          coverage: xdebug
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Checkout shared Composer scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: builtnorth/.github
          ref: main
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
          path: _builtnorth-github
          token: ${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN || github.token }}

      - name: Configure Composer VCS repositories
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN }}"}}'
        run: bash _builtnorth-github/.github/scripts/configure-composer-vcs-repos.sh "${{ inputs.composer-repository-profile }}"

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN }}"}}'
        run: |
          if [ -f composer.lock ]; then
            composer install --prefer-dist --no-progress --no-interaction
          else
            composer update --prefer-dist --no-progress --no-interaction
          fi

      - name: Install and start wp-env
        run: |
          npm init -y
          npm install @wordpress/env

          WP_VER="${{ matrix.wordpress-version }}"
          PHP_VER="${{ matrix.php-version }}"
          if [ "$WP_VER" = "latest" ]; then
            CORE=null
          else
            CORE="\"WordPress/WordPress#${WP_VER}\""
          fi
          cat > .wp-env.override.json <<EOF
          {
            "phpVersion": "${PHP_VER}",
            "core": ${CORE}
          }
          EOF
          echo "wp-env override:"
          cat .wp-env.override.json

          npx wp-env start

      - name: Verify wp-env PHP and WordPress
        run: |
          npx wp-env run tests-cli php -r 'echo PHP_VERSION, PHP_EOL;'
          npx wp-env run tests-cli wp core version

      - name: Run PHPUnit tests
        run: |
          # Run tests in the wp-env container with vendor directory from host
          npx wp-env run tests-cli --env-cwd=/var/www/html/wp-content/plugins/${{ env.PLUGIN_SLUG }} ./vendor/bin/phpunit

      - name: Upload coverage to Codecov
        if: matrix.php-version == '8.1' && matrix.wordpress-version == 'latest'
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella

  phpcs:
    if: inputs.run-phpcs
    name: PHP Coding Standards
    runs-on: ubuntu-latest
    needs: php-lint

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.1"
          coverage: none
          tools: composer:v2, cs2pr

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache composer dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Checkout shared Composer scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: builtnorth/.github
          ref: main
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
          path: _builtnorth-github
          token: ${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN || github.token }}

      - name: Configure Composer VCS repositories
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN }}"}}'
        run: bash _builtnorth-github/.github/scripts/configure-composer-vcs-repos.sh "${{ inputs.composer-repository-profile }}"

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN }}"}}'
        run: |
          if [ -f composer.lock ]; then
            composer install --prefer-dist --no-progress --no-interaction
          else
            composer update --prefer-dist --no-progress --no-interaction
          fi

      - name: Run PHPCS
        run: |
          # Run PHPCS (suppress cs2pr error on empty output)
          vendor/bin/phpcs --report=checkstyle | cs2pr || true

  php-compatibility:
    if: inputs.run-php-compatibility
    name: PHP Compatibility Check
    runs-on: ubuntu-latest
    needs: php-lint

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.1"
          coverage: none
          tools: composer:v2

      - name: Checkout shared Composer scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: builtnorth/.github
          ref: main
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
          path: _builtnorth-github
          token: ${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN || github.token }}

      - name: Configure Composer VCS repositories
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN }}"}}'
        run: bash _builtnorth-github/.github/scripts/configure-composer-vcs-repos.sh "${{ inputs.composer-repository-profile }}"

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN }}"}}'
        run: |
          if [ -f composer.lock ]; then
            composer install --prefer-dist --no-progress --no-interaction
          else
            composer update --prefer-dist --no-progress --no-interaction
          fi

      - name: Run PHP Compatibility check
        run: |
          # Check PHP compatibility with PHP 8.1+
          vendor/bin/phpcs . --standard=PHPCompatibility --extensions=php --runtime-set testVersion 8.1- --ignore=vendor/,node_modules/,build/

  security-check:
    if: inputs.run-security-check
    name: Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.1"
          coverage: none
          tools: composer:v2

      - name: Checkout shared Composer scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: builtnorth/.github
          ref: main
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
          path: _builtnorth-github
          token: ${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN || github.token }}

      - name: Configure Composer VCS repositories
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN }}"}}'
        run: bash _builtnorth-github/.github/scripts/configure-composer-vcs-repos.sh "${{ inputs.composer-repository-profile }}"

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN }}"}}'
        run: |
          if [ -f composer.lock ]; then
            composer install --prefer-dist --no-progress --no-interaction
          else
            composer update --prefer-dist --no-progress --no-interaction
          fi

      - name: Run security check for PHP dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN }}"}}'
        run: |
          composer require --dev roave/security-advisories:dev-latest
          composer audit --abandoned=report

  wp-taint:
    if: inputs.run-wp-taint
    name: wp-taint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: pcntl
          tools: composer:v2

      - name: Require wp-taint.toml
        run: |
          if [ ! -f wp-taint.toml ]; then
            echo "::error::run-wp-taint is enabled but wp-taint.toml is missing. Copy polaris-seo's wp-taint.toml, wp-taint-bootstrap.php, and wp-taint-baseline.json."
            exit 1
          fi

      - name: Install wp-taint
        working-directory: ${{ runner.temp }}
        run: |
          mkdir wp-taint-tools
          cd wp-taint-tools
          composer require enshrined/wp-taint:^0.3 --no-interaction --no-progress

      - name: Scan
        run: |
          "${{ runner.temp }}/wp-taint-tools/vendor/bin/wp-taint" scan \
            --format=sarif \
            --output=wp-taint.sarif

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3
        with:
          sarif_file: wp-taint.sarif
          wait-for-processing: false

  e2e:
    if: inputs.run-e2e
    name: E2E Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: php-lint

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.2'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, mysqli, pdo_mysql, bcmath, soap, intl, gd, exif, iconv
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Checkout shared Composer scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: builtnorth/.github
          ref: main
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
          path: _builtnorth-github
          token: ${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN || secrets.GITHUB_TOKEN || github.token }}

      - name: Configure Composer VCS repositories
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN }}"}}'
        run: bash _builtnorth-github/.github/scripts/configure-composer-vcs-repos.sh "${{ inputs.composer-repository-profile }}"

      - name: Install Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN }}"}}'
        run: |
          if [ -f composer.lock ]; then
            composer install --prefer-dist --no-progress --no-interaction
          else
            composer update --prefer-dist --no-progress --no-interaction
          fi

      - name: Install Playwright tooling
        run: npm install --omit=prod --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install chromium --with-deps

      - name: Start wp-env
        run: |
          cat > .wp-env.override.json <<EOF
          {
            "phpVersion": "8.2",
            "core": null
          }
          EOF
          npx wp-env start

      - name: Run Playwright
        env:
          CI: true
          WP_USERNAME: admin
          WP_PASSWORD: password
        run: npm run test:e2e

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-artifacts
          path: artifacts/
          if-no-files-found: ignore

  release-check:
    if: inputs.run-release-check && github.event_name == 'pull_request' && github.base_ref == 'main'
    name: Release Readiness Check
    runs-on: ubuntu-latest
    needs: [php-tests, phpcs]

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check version bump
        run: |
          # Check if version was bumped in main plugin file
          git fetch origin main
          PLUGIN_FILE="${PLUGIN_SLUG}.php"
          if [ -f "$PLUGIN_FILE" ]; then
            MAIN_VERSION=$(git show origin/main:$PLUGIN_FILE | grep -Po "Version:\s*\K[0-9.]+" || echo "0.0.0")
            PR_VERSION=$(grep -Po "Version:\s*\K[0-9.]+" $PLUGIN_FILE || echo "0.0.0")
            
            if [ "$MAIN_VERSION" == "$PR_VERSION" ]; then
              echo "::warning::Plugin version not bumped. Current version: $MAIN_VERSION"
            else
              echo "Version bumped from $MAIN_VERSION to $PR_VERSION"
            fi
          else
            echo "::warning::Main plugin file $PLUGIN_FILE not found"
          fi

      - name: Check changelog
        run: |
          if [ ! -f "CHANGELOG.md" ]; then
            echo "::warning::CHANGELOG.md not found - consider adding one"
          else
            echo "CHANGELOG.md found"
          fi

      - name: Check README
        run: |
          if [ ! -f "README.md" ] && [ ! -f "readme.txt" ]; then
            echo "::warning::No README found - consider adding README.md or readme.txt"
          else
            echo "README found"
          fi