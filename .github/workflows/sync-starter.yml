name: Sync Starter

# Rebuilds builtnorth/basecamp (the project starter) from the starter/ folder on
# basecamp-dev's main branch. Manual only. basecamp is generated: never edit it directly.
#
# 1. Build the starter tree with basecamp-dev's bin/build-starter.mjs.
# 2. Smoke test a copy the way setup-bn-project would use it: Composer install
#    from the private registry, Compass (main) as the theme, npm install + build.
# 3. Unless dry run: commit the tree on top of basecamp's history and push.
#
# Only first-party code runs next to the token: fetch gathers the private sources,
# smoke runs the third-party code (Composer plugins, npm, the build) with no secrets
# and its tree is thrown away, and publish rebuilds the tree with first-party code at
# the fetched commit and is the only job that can push.

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and smoke test only; do not push to basecamp"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: builtnorth-sync-starter
  cancel-in-progress: false

jobs:
  # The only job besides publish that gets the token, and it runs first-party code only:
  # checkout, the runner's own Node/PHP/Composer, our scripts (Composer plugins and scripts
  # off), gh, upload. It hands smoke the starter tree, its lock and Composer cache (paid
  # plugins' release zips included) and a Compass copy.
  fetch:
    name: Fetch private sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}

    steps:
      - name: Require cross-repository token
        env:
          GH_TOKEN: ${{ secrets.ORG_REPO_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::ORG_REPO_TOKEN is required."
            exit 1
          fi

      - name: Checkout shared scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout basecamp-dev
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: builtnorth/basecamp-dev
          ref: main
          token: ${{ secrets.ORG_REPO_TOKEN }}
          path: source
          submodules: false
          persist-credentials: false

      # The publish job builds from this same commit, even if main moves on.
      - name: Record the commit
        id: source
        run: echo "sha=$(git -C source rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The runner's own Node (20+); build-starter.mjs only copies files.
      - name: Build starter tree
        run: node source/bin/build-starter.mjs "$RUNNER_TEMP/deps/starter"

      - name: Fetch Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.ORG_REPO_TOKEN }}"}}'
        run: |
          cp -R "$RUNNER_TEMP/deps/starter" "$RUNNER_TEMP/fetch"
          cd "$RUNNER_TEMP/fetch"
          bash "$GITHUB_WORKSPACE/.github/scripts/fetch-private-deps.sh" "$RUNNER_TEMP/deps/composer"

      # gh passes its credential helper to this one clone only; .git is removed.
      - name: Fetch Compass
        env:
          GH_TOKEN: ${{ secrets.ORG_REPO_TOKEN }}
        run: |
          gh repo clone builtnorth/compass "$RUNNER_TEMP/deps/compass" -- --depth 1 --branch main
          rm -rf "$RUNNER_TEMP/deps/compass/.git"

      - name: Upload fetched sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: starter-sources
          path: ${{ runner.temp }}/deps
          include-hidden-files: true
          retention-days: 5
          overwrite: true

  # No secrets: Composer plugins, npm packages and the theme build run here.
  smoke:
    name: Smoke test
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Download fetched sources
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: starter-sources
          path: ${{ runner.temp }}/deps

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      # The way setup-bn-project uses the starter: Composer install, Compass as the theme.
      - name: Smoke test - Composer install
        env:
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/deps/composer/cache
        run: |
          cp -R "$RUNNER_TEMP/deps/starter" "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          cp "$RUNNER_TEMP/deps/composer/composer.lock" composer.lock
          composer install --no-interaction --no-progress
          for plugin in analytics backup blocks dashboard forms performance security seo; do
            test -f "wp-content/plugins/kitaris-$plugin/kitaris-$plugin.php" || { echo "::error::kitaris-$plugin did not install"; exit 1; }
          done

      - name: Smoke test - theme build
        run: |
          cd "$RUNNER_TEMP/smoke"
          cp -R "$RUNNER_TEMP/deps/compass" wp-content/themes/compass
          npm install --no-audit --no-fund --ignore-scripts
          npm run build
          test -d wp-content/themes/compass/build/assets || { echo "::error::Compass build/ is missing"; exit 1; }

  publish:
    name: ${{ inputs.dry_run && 'Show the starter diff' || 'Publish to basecamp' }}
    needs: [fetch, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.ORG_REPO_TOKEN }}
      GIT_AUTHOR_NAME: Dan Northern
      GIT_AUTHOR_EMAIL: git@dannorthern.com
      GIT_COMMITTER_NAME: Dan Northern
      GIT_COMMITTER_EMAIL: git@dannorthern.com

    steps:
      - name: Checkout basecamp-dev
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: builtnorth/basecamp-dev
          ref: ${{ needs.fetch.outputs.sha }}
          token: ${{ secrets.ORG_REPO_TOKEN }}
          path: source
          submodules: false
          persist-credentials: false

      # The runner's own Node (20+); first-party only: copies files, installs nothing.
      - name: Build starter tree
        run: node source/bin/build-starter.mjs "$RUNNER_TEMP/starter"

      - name: Configure repository authentication
        run: gh auth setup-git

      - name: Publish to basecamp
        if: ${{ !inputs.dry_run }}
        run: |
          source_sha=$(git -C source rev-parse --short HEAD)
          git clone https://github.com/builtnorth/basecamp.git "$RUNNER_TEMP/basecamp"
          rsync -a --delete --exclude .git "$RUNNER_TEMP/starter/" "$RUNNER_TEMP/basecamp/"
          cd "$RUNNER_TEMP/basecamp"
          git add -A
          if git diff --cached --quiet; then
            echo "basecamp already matches basecamp-dev $source_sha."
            exit 0
          fi
          git diff --cached --stat
          git commit -q -m "chore: sync from basecamp-dev $source_sha"
          git push origin HEAD:main

      - name: Show the starter diff (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          git clone --depth 1 https://github.com/builtnorth/basecamp.git "$RUNNER_TEMP/basecamp"
          diff -rq --exclude .git "$RUNNER_TEMP/basecamp" "$RUNNER_TEMP/starter" || true
