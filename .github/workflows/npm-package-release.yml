name: Reusable NPM Package Release

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0) - used for manual dispatch'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        type: boolean
        default: false
      package-name:
        description: 'Package name (defaults to repository name)'
        required: false
        type: string
        default: ''
      node-version:
        description: 'Node version to use for build'
        required: false
        type: string
        default: '22'
      publish-to-npm:
        description: 'Publish to npm registry'
        required: false
        type: boolean
        default: false
      publish-to-github:
        description: 'Publish to GitHub Packages'
        required: false
        type: boolean
        default: true
      use-workspace:
        description: 'Use npm workspace setup'
        required: false
        type: boolean
        default: true
    secrets:
      POLARIS_PLUGIN_GITHUB_TOKEN:
        required: false
      NPM_TOKEN:
        required: false

env:
  PACKAGE_NAME: ${{ inputs.package-name || github.event.repository.name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v3

      - name: Get version from tag or input
        id: version
        run: |
          # Determine version from tag push or manual input
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"  # Remove v prefix
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"  # Remove v prefix if present
          else
            echo "Error: No version specified"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_TAG=v$VERSION" >> $GITHUB_OUTPUT
          echo "PACKAGE_NAME=${{ env.PACKAGE_NAME }}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ inputs.node-version }}

      - name: Configure GitHub Packages auth
        run: |
          echo "@builtnorth:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ github.token }}" >> .npmrc
          echo "@polaris:registry=https://npm.pkg.github.com" >> .npmrc

      - name: Checkout parent repository for workspace
        if: inputs.use-workspace
        uses: actions/checkout@v3
        with:
          repository: ${{ github.repository_owner }}/basecamp-dev
          path: workspace-root
          token: ${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN || github.token }}

      - name: Setup workspace and install dependencies
        if: inputs.use-workspace
        run: |
          # Copy this package into the workspace structure
          mkdir -p workspace-root/npm_packages
          # Use rsync to exclude the workspace-root directory itself
          rsync -av --exclude='workspace-root' --exclude='.git' . workspace-root/npm_packages/${{ steps.version.outputs.PACKAGE_NAME }}/

          # Navigate to workspace root
          cd workspace-root

          # Install all dependencies (respects workspace)
          npm ci

      - name: Install dependencies (non-workspace)
        if: '!inputs.use-workspace'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build package
        run: |
          if [ "${{ inputs.use-workspace }}" = "true" ]; then
            cd workspace-root/npm_packages/${{ steps.version.outputs.PACKAGE_NAME }}
          fi
          npm run build

      - name: Prepare release package
        run: |
          # Work from the built package directory
          if [ "${{ inputs.use-workspace }}" = "true" ]; then
            cd workspace-root/npm_packages/${{ steps.version.outputs.PACKAGE_NAME }}
          fi

          # Create a release directory
          mkdir -p release-package

          # Copy necessary files
          cp -r build release-package/
          cp -r src release-package/ 2>/dev/null || true
          cp package.json release-package/
          cp README.md release-package/ || true
          cp LICENSE release-package/ || true

          # Update package.json to point to built files
          cd release-package
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          // Update main to point to built file
          if (pkg.main && pkg.main.includes('src/')) {
            pkg.main = pkg.main.replace('src/', 'build/');
          }

          // Ensure version matches tag
          pkg.version = '${{ steps.version.outputs.VERSION }}';

          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

          # Create tarball
          cd ..
          tar -czf ${{ steps.version.outputs.PACKAGE_NAME }}-${{ steps.version.outputs.VERSION }}.tar.gz -C release-package .

      - name: Create tag if not exists
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        run: |
          # Configure git
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          TAG="${{ steps.version.outputs.VERSION_TAG }}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists locally"
          elif git ls-remote --exit-code origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists on remote"
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p' || echo "")

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, this is the first release"
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          echo "Comparing changes from $PREVIOUS_TAG to HEAD"

          # Generate commits (allow empty result)
          COMMITS=$(git log --pretty=format:"- %s (%h)" "$PREVIOUS_TAG"..HEAD | grep -v "Merge branch" || true)

          # Group commits by type
          FEATURES=$(echo "$COMMITS" | grep -E "^- (feat|feature):" || true)
          FIXES=$(echo "$COMMITS" | grep -E "^- (fix|bugfix):" || true)
          DOCS=$(echo "$COMMITS" | grep -E "^- (docs|documentation):" || true)
          STYLE=$(echo "$COMMITS" | grep -E "^- (style|formatting):" || true)
          REFACTOR=$(echo "$COMMITS" | grep -E "^- (refactor|refactoring):" || true)
          TEST=$(echo "$COMMITS" | grep -E "^- (test|tests):" || true)
          CHORE=$(echo "$COMMITS" | grep -E "^- (chore|build|ci):" || true)
          OTHER=$(echo "$COMMITS" | grep -vE "^- (feat|feature|fix|bugfix|docs|documentation|style|formatting|refactor|refactoring|test|tests|chore|build|ci):" || true)

          WHATS_CHANGED=""
          if [ -n "$FEATURES" ]; then
            WHATS_CHANGED="${WHATS_CHANGED}### Features"$'\n'"${FEATURES}"$'\n\n'
          fi
          if [ -n "$FIXES" ]; then
            WHATS_CHANGED="${WHATS_CHANGED}### Bug Fixes"$'\n'"${FIXES}"$'\n\n'
          fi
          if [ -n "$DOCS" ]; then
            WHATS_CHANGED="${WHATS_CHANGED}### Documentation"$'\n'"${DOCS}"$'\n\n'
          fi
          if [ -n "$REFACTOR" ]; then
            WHATS_CHANGED="${WHATS_CHANGED}### Refactoring"$'\n'"${REFACTOR}"$'\n\n'
          fi
          if [ -n "$TEST" ]; then
            WHATS_CHANGED="${WHATS_CHANGED}### Tests"$'\n'"${TEST}"$'\n\n'
          fi
          if [ -n "$CHORE" ]; then
            WHATS_CHANGED="${WHATS_CHANGED}### Maintenance"$'\n'"${CHORE}"$'\n\n'
          fi
          if [ -n "$OTHER" ]; then
            WHATS_CHANGED="${WHATS_CHANGED}### Other Changes"$'\n'"${OTHER}"$'\n\n'
          fi
          if [ -z "$COMMITS" ]; then
            WHATS_CHANGED="No changes recorded since ${PREVIOUS_TAG}."$'\n\n'
          fi

          # Save to output
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

          # Use EOF to handle multiline output
          echo "WHATS_CHANGED<<EOF" >> $GITHUB_OUTPUT
          echo "$WHATS_CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release with GitHub CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Determine archive location
          if [ "${{ inputs.use-workspace }}" = "true" ]; then
            ARCHIVE_PATH="workspace-root/npm_packages/${{ steps.version.outputs.PACKAGE_NAME }}/${{ steps.version.outputs.PACKAGE_NAME }}-${{ steps.version.outputs.VERSION }}.tar.gz"
          else
            ARCHIVE_PATH="${{ steps.version.outputs.PACKAGE_NAME }}-${{ steps.version.outputs.VERSION }}.tar.gz"
          fi

          TAG="${{ steps.version.outputs.VERSION_TAG }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — upload archive if missing, then exit"
            if ! gh release view "$TAG" --json assets -q '.assets[].name' | grep -q "${{ steps.version.outputs.PACKAGE_NAME }}-${{ steps.version.outputs.VERSION }}.tar.gz"; then
              gh release upload "$TAG" "$ARCHIVE_PATH" --clobber
            fi
            exit 0
          fi

          # Materialize expressions as shell vars first, then write the notes file
          # with a quoted heredoc so the markdown code fences below aren't parsed
          # as shell command substitution.
          PACKAGE_NAME="${{ steps.version.outputs.PACKAGE_NAME }}"
          VERSION="${{ steps.version.outputs.VERSION }}"
          VERSION_TAG="${{ steps.version.outputs.VERSION_TAG }}"
          PREVIOUS_TAG="${{ steps.changelog.outputs.PREVIOUS_TAG }}"
          WHATS_CHANGED="${{ steps.changelog.outputs.WHATS_CHANGED }}"
          REPO="${{ github.repository }}"

          {
            echo "## ${PACKAGE_NAME} v${VERSION}"
            echo ""
            echo "### What's Changed"
            echo "$WHATS_CHANGED"
            echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREVIOUS_TAG}...${VERSION_TAG}"
            echo ""
            echo "### Installation"
            echo ""
            echo "#### Via npm (from GitHub Packages):"
            echo '```bash'
            echo "npm install @builtnorth/${PACKAGE_NAME}@${VERSION}"
            echo '```'
            echo ""
            echo "#### Via package.json:"
            echo '```json'
            echo "\"@builtnorth/${PACKAGE_NAME}\": \"${VERSION}\""
            echo '```'
            echo ""
            echo "### What's included"
            echo "- Compiled JavaScript (ES5)"
            echo "- CSS styles (if applicable)"
            echo "- Source maps for debugging"
          } > release_notes.md

          # Create release
          gh release create "$TAG" \
            --title "Release ${{ steps.version.outputs.VERSION_TAG }}" \
            --notes-file release_notes.md \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            $ARCHIVE_PATH

      - name: Publish to npm registry
        if: inputs.publish-to-npm
        run: |
          if [ "${{ inputs.use-workspace }}" = "true" ]; then
            cd workspace-root/npm_packages/${{ steps.version.outputs.PACKAGE_NAME }}/release-package
          else
            cd release-package
          fi

          # Configure npm for public registry
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc

          # Publish
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to GitHub Packages
        if: inputs.publish-to-github
        continue-on-error: true
        run: |
          if [ "${{ inputs.use-workspace }}" = "true" ]; then
            cd workspace-root/npm_packages/${{ steps.version.outputs.PACKAGE_NAME }}/release-package
          else
            cd release-package
          fi

          # Configure npm for GitHub Packages
          echo "@builtnorth:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ github.token }}" >> .npmrc

          # Publish
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}