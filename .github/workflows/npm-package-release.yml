name: Reusable NPM Package Release

on:
  workflow_call:
    inputs:
      version:
        description: 'Release version (e.g., 1.0.0) - used for manual dispatch'
        required: false
        type: string
        default: ''
      prerelease:
        description: 'Is this a pre-release?'
        required: false
        type: boolean
        default: false
      package-name:
        description: 'Package name (defaults to repository name)'
        required: false
        type: string
        default: ''
      node-version:
        description: 'Node version to use for build'
        required: false
        type: string
        default: '22'
      publish-to-npm:
        description: 'Publish to npm registry'
        required: false
        type: boolean
        default: false
      publish-to-github:
        description: 'Publish to GitHub Packages'
        required: false
        type: boolean
        default: true
      use-workspace:
        description: 'Use npm workspace setup'
        required: false
        type: boolean
        default: true
      run-tests:
        description: 'Run tests during release CI'
        required: false
        type: boolean
        default: true
      run-lint:
        description: 'Run linting during release CI'
        required: false
        type: boolean
        default: true
      run-build:
        description: 'Run build during release CI'
        required: false
        type: boolean
        default: true
      lint-command:
        description: 'Lint script name for release CI'
        required: false
        type: string
        default: 'lint'
      test-command:
        description: 'Test script name for release CI'
        required: false
        type: string
        default: 'test'
    secrets:
      POLARIS_PLUGIN_GITHUB_TOKEN:
        required: false
      NPM_TOKEN:
        required: false

env:
  PACKAGE_NAME: ${{ inputs.package-name || github.event.repository.name }}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      already_released: ${{ steps.release.outputs.already_released }}
    steps:
      - name: Check release idempotency
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ inputs.version || github.ref_name }}"
          TAG="v${VERSION#v}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "already_released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "already_released=false" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" != "push" ] && gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG exists without a release. Resolve that partial release before retrying."
            exit 1
          fi

  ci:
    needs: preflight
    if: needs.preflight.outputs.already_released != 'true'
    uses: builtnorth/.github/.github/workflows/npm-package-ci.yml@main
    with:
      package-name: ${{ inputs.package-name }}
      use-workspace: ${{ inputs.use-workspace }}
      run-tests: ${{ inputs.run-tests }}
      run-lint: ${{ inputs.run-lint }}
      run-build: ${{ inputs.run-build }}
      lint-command: ${{ inputs.lint-command }}
      test-command: ${{ inputs.test-command }}
    secrets:
      POLARIS_PLUGIN_GITHUB_TOKEN: ${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN }}

  build:
    needs: [preflight, ci]
    if: needs.preflight.outputs.already_released != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Get version from tag or input
        id: version
        run: |
          # Determine version from tag push or manual input
          if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"  # Remove v prefix
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
            VERSION="${VERSION#v}"  # Remove v prefix if present
          else
            echo "Error: No version specified"
            exit 1
          fi
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "VERSION_TAG=v$VERSION" >> $GITHUB_OUTPUT
          echo "PACKAGE_NAME=${{ env.PACKAGE_NAME }}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Finalize source package version
        if: github.event_name != 'push'
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version

      - name: Verify tagged source version
        if: github.event_name == 'push'
        run: |
          SOURCE_VERSION=$(node -p "require('./package.json').version")
          if [ "$SOURCE_VERSION" != "${{ steps.version.outputs.VERSION }}" ]; then
            echo "::error::Tag ${{ steps.version.outputs.VERSION_TAG }} points to package.json version $SOURCE_VERSION."
            exit 1
          fi

      - name: Commit finalized release source
        if: github.event_name != 'push'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json package-lock.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: prepare ${{ steps.version.outputs.VERSION_TAG }} release"
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Record release source commit
        run: echo "RELEASE_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Configure GitHub Packages auth
        run: |
          echo "@builtnorth:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN || github.token }}" >> .npmrc
          echo "@polaris:registry=https://npm.pkg.github.com" >> .npmrc

      - name: Checkout parent repository for workspace
        if: inputs.use-workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository_owner }}/basecamp-dev
          path: workspace-root
          token: ${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN || github.token }}

      - name: Setup workspace and install dependencies
        if: inputs.use-workspace
        run: |
          # Copy this package into the workspace structure
          mkdir -p workspace-root/npm_packages
          # Use rsync to exclude the workspace-root directory itself
          rsync -av --exclude='workspace-root' --exclude='.git' . workspace-root/npm_packages/${{ steps.version.outputs.PACKAGE_NAME }}/

          # Navigate to workspace root
          cd workspace-root

          # Install all dependencies (respects workspace)
          npm ci

      - name: Install dependencies (non-workspace)
        if: '!inputs.use-workspace'
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build package
        run: |
          if [ "${{ inputs.use-workspace }}" = "true" ]; then
            cd workspace-root/npm_packages/${{ steps.version.outputs.PACKAGE_NAME }}
          fi
          npm run build

      - name: Prepare release package
        run: |
          # Work from the built package directory
          if [ "${{ inputs.use-workspace }}" = "true" ]; then
            cd workspace-root/npm_packages/${{ steps.version.outputs.PACKAGE_NAME }}
          fi

          # Create a release directory
          mkdir -p release-package

          # Copy necessary files
          cp -r build release-package/
          cp -r src release-package/ 2>/dev/null || true
          cp package.json release-package/
          cp README.md release-package/ || true
          cp LICENSE release-package/ || true

          # Update package.json to point to built files
          cd release-package
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));

          // Update main to point to built file
          if (pkg.main && pkg.main.includes('src/')) {
            pkg.main = pkg.main.replace('src/', 'build/');
          }

          // Ensure version matches tag
          pkg.version = '${{ steps.version.outputs.VERSION }}';

          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "

          # Create tarball
          cd ..
          tar -czf ${{ steps.version.outputs.PACKAGE_NAME }}-${{ steps.version.outputs.VERSION }}.tar.gz -C release-package .
          {
            printf '# source-commit %s\n' "$RELEASE_SOURCE_SHA"
            tar -tzf ${{ steps.version.outputs.PACKAGE_NAME }}-${{ steps.version.outputs.VERSION }}.tar.gz | LC_ALL=C sort
          } > ${{ steps.version.outputs.PACKAGE_NAME }}-${{ steps.version.outputs.VERSION }}.manifest.txt
          sha256sum ${{ steps.version.outputs.PACKAGE_NAME }}-${{ steps.version.outputs.VERSION }}.tar.gz > ${{ steps.version.outputs.PACKAGE_NAME }}-${{ steps.version.outputs.VERSION }}.tar.gz.sha256

      - name: Create tag if not exists
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
        run: |
          TAG="${{ steps.version.outputs.VERSION_TAG }}"
          git fetch origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            if [ "$(git rev-list -n1 "$TAG")" != "$(git rev-parse HEAD)" ]; then
              echo "::error::Tag $TAG already exists but does not point to finalized HEAD."
              exit 1
            fi
            echo "Tag $TAG already points to finalized HEAD."
          else
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
          fi

      - name: Generate changelog
        id: changelog
        run: |
          CURRENT="${{ steps.version.outputs.VERSION_TAG }}"
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "$CURRENT" | sed -n '1p' || true)

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found, this is the first release"
            PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
          fi

          echo "Comparing changes from $PREVIOUS_TAG to HEAD ($CURRENT)"

          COMMITS=$(git log --pretty=format:"- %s (%h)" "$PREVIOUS_TAG"..HEAD | grep -v "Merge branch" || true)

          # Group commits by type. Matches plain (fix:), scoped (fix(auth):),
          # and breaking (fix!:, fix(auth)!:) Conventional Commits forms — a bare
          # type: with no scope support silently drops scoped commits into
          # "Other Changes".
          SCOPE='(\([^)]*\))?!?'
          FEATURES=$(echo "$COMMITS" | grep -iE "^- (feat|feature)${SCOPE}:" || true)
          FIXES=$(echo "$COMMITS" | grep -iE "^- (fix|bugfix)${SCOPE}:" || true)
          DOCS=$(echo "$COMMITS" | grep -iE "^- (docs|documentation)${SCOPE}:" || true)
          STYLE=$(echo "$COMMITS" | grep -iE "^- (style|formatting)${SCOPE}:" || true)
          REFACTOR=$(echo "$COMMITS" | grep -iE "^- (refactor|refactoring)${SCOPE}:" || true)
          TEST=$(echo "$COMMITS" | grep -iE "^- (test|tests)${SCOPE}:" || true)
          CHORE=$(echo "$COMMITS" | grep -iE "^- (chore|build|ci)${SCOPE}:" || true)
          OTHER=$(echo "$COMMITS" | grep -ivE "^- (feat|feature|fix|bugfix|docs|documentation|style|formatting|refactor|refactoring|test|tests|chore|build|ci)${SCOPE}:" || true)

          WHATS_CHANGED=""
          if [ -n "$FEATURES" ]; then
            WHATS_CHANGED="${WHATS_CHANGED}### Features"$'\n'"${FEATURES}"$'\n\n'
          fi
          if [ -n "$FIXES" ]; then
            WHATS_CHANGED="${WHATS_CHANGED}### Bug Fixes"$'\n'"${FIXES}"$'\n\n'
          fi
          if [ -n "$DOCS" ]; then
            WHATS_CHANGED="${WHATS_CHANGED}### Documentation"$'\n'"${DOCS}"$'\n\n'
          fi
          if [ -n "$REFACTOR" ]; then
            WHATS_CHANGED="${WHATS_CHANGED}### Refactoring"$'\n'"${REFACTOR}"$'\n\n'
          fi
          if [ -n "$TEST" ]; then
            WHATS_CHANGED="${WHATS_CHANGED}### Tests"$'\n'"${TEST}"$'\n\n'
          fi
          if [ -n "$CHORE" ]; then
            WHATS_CHANGED="${WHATS_CHANGED}### Maintenance"$'\n'"${CHORE}"$'\n\n'
          fi
          if [ -n "$OTHER" ]; then
            WHATS_CHANGED="${WHATS_CHANGED}### Other Changes"$'\n'"${OTHER}"$'\n\n'
          fi
          if [ -z "$COMMITS" ]; then
            WHATS_CHANGED="No changes recorded since ${PREVIOUS_TAG}."$'\n\n'
          fi

          # Save to output
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

          # Use EOF to handle multiline output
          echo "WHATS_CHANGED<<EOF" >> $GITHUB_OUTPUT
          echo "$WHATS_CHANGED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release with GitHub CLI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Determine archive location
          if [ "${{ inputs.use-workspace }}" = "true" ]; then
            ARCHIVE_PATH="workspace-root/npm_packages/${{ steps.version.outputs.PACKAGE_NAME }}/${{ steps.version.outputs.PACKAGE_NAME }}-${{ steps.version.outputs.VERSION }}.tar.gz"
            MANIFEST_PATH="workspace-root/npm_packages/${{ steps.version.outputs.PACKAGE_NAME }}/${{ steps.version.outputs.PACKAGE_NAME }}-${{ steps.version.outputs.VERSION }}.manifest.txt"
            CHECKSUM_PATH="${ARCHIVE_PATH}.sha256"
          else
            ARCHIVE_PATH="${{ steps.version.outputs.PACKAGE_NAME }}-${{ steps.version.outputs.VERSION }}.tar.gz"
            MANIFEST_PATH="${{ steps.version.outputs.PACKAGE_NAME }}-${{ steps.version.outputs.VERSION }}.manifest.txt"
            CHECKSUM_PATH="${ARCHIVE_PATH}.sha256"
          fi

          TAG="${{ steps.version.outputs.VERSION_TAG }}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — upload archive if missing, then exit"
            if ! gh release view "$TAG" --json assets -q '.assets[].name' | grep -q "${{ steps.version.outputs.PACKAGE_NAME }}-${{ steps.version.outputs.VERSION }}.tar.gz"; then
              gh release upload "$TAG" "$ARCHIVE_PATH" "$MANIFEST_PATH" "$CHECKSUM_PATH"
            fi
            exit 0
          fi

          # Materialize expressions as shell vars first, then write the notes file
          # with a quoted heredoc so the markdown code fences below aren't parsed
          # as shell command substitution.
          PACKAGE_NAME="${{ steps.version.outputs.PACKAGE_NAME }}"
          VERSION="${{ steps.version.outputs.VERSION }}"
          VERSION_TAG="${{ steps.version.outputs.VERSION_TAG }}"
          PREVIOUS_TAG="${{ steps.changelog.outputs.PREVIOUS_TAG }}"
          WHATS_CHANGED="${{ steps.changelog.outputs.WHATS_CHANGED }}"
          REPO="${{ github.repository }}"

          {
            echo "## ${PACKAGE_NAME} v${VERSION}"
            echo ""
            echo "### What's Changed"
            echo "$WHATS_CHANGED"
            echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREVIOUS_TAG}...${VERSION_TAG}"
            echo ""
            echo "### Installation"
            echo ""
            echo "#### Via npm (from GitHub Packages):"
            echo '```bash'
            echo "npm install @builtnorth/${PACKAGE_NAME}@${VERSION}"
            echo '```'
            echo ""
            echo "#### Via package.json:"
            echo '```json'
            echo "\"@builtnorth/${PACKAGE_NAME}\": \"${VERSION}\""
            echo '```'
            echo ""
            echo "### What's included"
            echo "- Compiled JavaScript (ES5)"
            echo "- CSS styles (if applicable)"
            echo "- Source maps for debugging"
          } > release_notes.md

          # Create release
          gh release create "$TAG" \
            --title "Release ${{ steps.version.outputs.VERSION_TAG }}" \
            --notes-file release_notes.md \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            "$ARCHIVE_PATH" \
            "$MANIFEST_PATH" \
            "$CHECKSUM_PATH"

      - name: Publish to npm registry
        if: inputs.publish-to-npm
        run: |
          if [ "${{ inputs.use-workspace }}" = "true" ]; then
            cd workspace-root/npm_packages/${{ steps.version.outputs.PACKAGE_NAME }}/release-package
          else
            cd release-package
          fi

          # Configure npm for public registry
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> .npmrc

          # Publish
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to GitHub Packages
        if: inputs.publish-to-github
        continue-on-error: true
        run: |
          if [ "${{ inputs.use-workspace }}" = "true" ]; then
            cd workspace-root/npm_packages/${{ steps.version.outputs.PACKAGE_NAME }}/release-package
          else
            cd release-package
          fi

          # Configure npm for GitHub Packages
          echo "@builtnorth:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${{ github.token }}" >> .npmrc

          # Publish
          npm publish
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}