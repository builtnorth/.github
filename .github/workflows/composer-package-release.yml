name: Reusable Composer Package Release

on:
    workflow_call:
        inputs:
            version:
                description: "Release version (e.g., 1.0.0)"
                required: false
                type: string
                default: ""
            prerelease:
                description: "Is this a pre-release?"
                required: false
                type: boolean
                default: false
            package-name:
                description: "Package name for archive (defaults to repository name)"
                required: false
                type: string
                default: ""
            package-display-name:
                description: "Display name for package"
                required: false
                type: string
                default: ""
            composer-namespace:
                description: "Composer namespace (e.g., builtnorth/package-name)"
                required: false
                type: string
                default: ""
            composer-repository-profile:
                description: "from-composer (default) = VCS repos derived from this package's composer.json; coding-standards-only; full = legacy kitchen-sink"
                required: false
                type: string
                default: "from-composer"
            run-ci:
                description: "Run package CI before creating the release"
                required: false
                type: boolean
                default: true
        secrets:
            WORKFLOW_TOKEN:
                required: false
            POLARIS_PLUGIN_GITHUB_TOKEN:
                required: false

env:
    PACKAGE_NAME: ${{ inputs.package-name || github.event.repository.name }}
    PACKAGE_DISPLAY_NAME: ${{ inputs.package-display-name || github.event.repository.name }}
    COMPOSER_NAMESPACE: ${{ inputs.composer-namespace || format('builtnorth/{0}', github.event.repository.name) }}

concurrency:
    group: release-${{ github.repository }}
    cancel-in-progress: false

jobs:
    preflight:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            already_released: ${{ steps.release.outputs.already_released }}
        steps:
            - name: Check release idempotency
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  VERSION="${{ inputs.version || github.ref_name }}"
                  TAG="v${VERSION#v}"
                  if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
                    echo "already_released=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  echo "already_released=false" >> "$GITHUB_OUTPUT"
                  if [ "${{ github.event_name }}" != "push" ] && gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
                    echo "::error::Tag $TAG exists without a release. Resolve that partial release before retrying."
                    exit 1
                  fi

    ci:
        needs: preflight
        if: needs.preflight.outputs.already_released != 'true' && inputs.run-ci
        uses: builtnorth/.github/.github/workflows/composer-package-ci.yml@5634494f26edb54bbc77716b09ed298e52e633c0
        with:
            composer-repository-profile: ${{ inputs.composer-repository-profile }}
        secrets:
            POLARIS_PLUGIN_GITHUB_TOKEN: ${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN }}
            WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}

    release:
        name: Create Release
        needs: [preflight, ci]
        if: >-
            always()
            && !cancelled()
            && needs.preflight.result == 'success'
            && needs.preflight.outputs.already_released != 'true'
            && (needs.ci.result == 'success' || needs.ci.result == 'skipped')
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0
                  token: ${{ secrets.WORKFLOW_TOKEN || github.token }}

            - name: Determine version
              id: version
              run: |
                  # Check if triggered by tag push or manual input
                  if [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/* ]]; then
                    VERSION="${{ github.ref_name }}"
                  elif [ -n "${{ inputs.version }}" ]; then
                    VERSION="${{ inputs.version }}"
                    if [[ ! "$VERSION" =~ ^v ]]; then
                      VERSION="v$VERSION"
                    fi
                  else
                    echo "Error: No version specified"
                    exit 1
                  fi
                  echo "version=$VERSION" >> $GITHUB_OUTPUT
                  echo "version_number=${VERSION#v}" >> $GITHUB_OUTPUT

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: "8.2"
                  tools: composer:v2

            - name: Get Composer cache directory
              id: composer-cache
              run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

            - name: Cache Composer packages
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ${{ steps.composer-cache.outputs.dir }}
                  key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
                  restore-keys: ${{ runner.os }}-composer-

            - name: Clean composer.json for production
              if: hashFiles('composer.json') != '' && github.event_name != 'push'
              run: |
                  # Remove @dev dependencies and path repositories for production release
                  if [ -f composer.json ]; then
                    # Remove path-type repositories (only if repositories field exists)
                    jq 'if .repositories then del(.repositories[] | select(.type == "path")) else . end' composer.json > composer.tmp.json
                    mv composer.tmp.json composer.json

                    # Remove @dev requirements
                    jq '.require = (.require | with_entries(select(.value != "@dev")))' composer.json > composer.tmp.json
                    mv composer.tmp.json composer.json
                  fi

            - name: Checkout shared release scripts
              if: hashFiles('composer.json') != '' && github.event_name != 'push'
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  repository: builtnorth/.github
                  ref: main
                  path: _builtnorth-github
                  token: ${{ github.token }}

            - name: Stamp runtime version metadata
              if: hashFiles('composer.json') != '' && github.event_name != 'push'
              run: bash _builtnorth-github/.github/scripts/stamp-composer-runtime-version.sh "${{ steps.version.outputs.version_number }}"

            - name: Configure git for Composer VCS clones
              if: hashFiles('composer.json') != ''
              env:
                  POLARIS_PLUGIN_GITHUB_TOKEN: ${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN }}
                  WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
              run: |
                  TOKEN="${POLARIS_PLUGIN_GITHUB_TOKEN:-${WORKFLOW_TOKEN:-}}"
                  if [ -z "$TOKEN" ]; then
                    echo "::error::POLARIS_PLUGIN_GITHUB_TOKEN (and WORKFLOW_TOKEN) are empty — refusing github.token fallback for private VCS."
                    echo "::error::Grant the org secret to this private repository (org Settings → Secrets → Repository access)."
                    exit 1
                  fi
                  git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
                  git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
                  echo "GITHUB_TOKEN_CONFIGURED=1" >> "$GITHUB_ENV"
                  if [ -n "${POLARIS_PLUGIN_GITHUB_TOKEN}" ]; then
                    echo "Private VCS token source: POLARIS_PLUGIN_GITHUB_TOKEN"
                  else
                    echo "Private VCS token source: WORKFLOW_TOKEN"
                  fi

            - name: Finalize and verify Composer dependencies
              if: hashFiles('composer.json') != '' && github.event_name != 'push'
              env:
                  POLARIS_PLUGIN_GITHUB_TOKEN: ${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN }}
                  WORKFLOW_TOKEN: ${{ secrets.WORKFLOW_TOKEN }}
                  GH_TOKEN: ${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN || secrets.WORKFLOW_TOKEN || github.token }}
                  COMPOSER_AUTH: |
                      {
                          "github-oauth": {
                              "github.com": "${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN || secrets.WORKFLOW_TOKEN || github.token }}"
                          }
                      }
              run: |
                  if [ -z "${POLARIS_PLUGIN_GITHUB_TOKEN}" ] && [ -z "${WORKFLOW_TOKEN}" ]; then
                    echo "::error::POLARIS_PLUGIN_GITHUB_TOKEN (and WORKFLOW_TOKEN) are empty in this workflow."
                    echo "::error::Create Release would fall back to github.token, which cannot read other private builtnorth/* repos."
                    echo "::error::Grant the org secret to this private repository (org Settings → Secrets → Repository access)."
                    exit 1
                  fi
                  if [ -z "${GH_TOKEN}" ]; then
                    echo "::error::GH_TOKEN is empty — cannot resolve private builtnorth dependencies."
                    exit 1
                  fi
                  echo "Private Composer token source: $( [ -n "${POLARIS_PLUGIN_GITHUB_TOKEN}" ] && echo POLARIS_PLUGIN_GITHUB_TOKEN || echo WORKFLOW_TOKEN )"

                  DIRECT_PACKAGES=$(jq -r '.require // {} | keys[]' composer.json | grep '^builtnorth/' || true)
                  bash _builtnorth-github/.github/scripts/pin-builtnorth-composer-deps.sh prepare

                  composer update --no-dev --no-scripts --no-interaction --prefer-dist
                  if [ -n "$DIRECT_PACKAGES" ]; then
                    bash _builtnorth-github/.github/scripts/pin-builtnorth-composer-deps.sh verify
                  fi
                  rm -rf vendor

            # Skip composer.json version update - version tracked via git tags only
            # This prevents merge conflicts between branches

            - name: Update package.json version
              if: hashFiles('package.json') != '' && github.event_name != 'push'
              run: |
                  npm version ${{ steps.version.outputs.version_number }} --no-git-tag-version --allow-same-version

            - name: Commit finalized manifests and lock
              if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
              run: |
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"

                  git add composer.json composer.lock inc/Core/Constants.php inc/classes/Base/DefineConstants.php 2>/dev/null || true

                  # Add package.json updates if they exist
                  if [ -f package.json ]; then
                    git add package.json package-lock.json 2>/dev/null || true
                  fi

                  # Commit if there are changes
                  if ! git diff --cached --quiet; then
                    git commit -m "chore: prepare v${{ steps.version.outputs.version_number }} release"
                    git push origin HEAD:${{ github.ref_name }}
                  fi

            - name: Install finalized production dependencies
              if: hashFiles('composer.lock') != ''
              env:
                  COMPOSER_AUTH: |
                      {
                          "github-oauth": {
                              "github.com": "${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN || secrets.WORKFLOW_TOKEN || github.token }}"
                          }
                      }
              run: composer install --no-dev --no-scripts --no-interaction --prefer-dist --optimize-autoloader

            - name: Create and push tag
              if: github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_call'
              run: |
                  TAG="${{ steps.version.outputs.version }}"
                  git fetch origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
                  if git rev-parse "$TAG" >/dev/null 2>&1; then
                    if [ "$(git rev-list -n1 "$TAG")" != "$(git rev-parse HEAD)" ]; then
                      echo "::error::Tag $TAG already exists but does not point to finalized HEAD."
                      exit 1
                    fi
                    echo "Tag $TAG already points to finalized HEAD."
                  else
                    git tag -a "$TAG" -m "Release $TAG"
                    git push origin "$TAG"
                  fi

            - name: Generate changelog
              id: changelog
              run: |
                  # Get the previous tag
                  PREVIOUS_TAG=$(git describe --tags --abbrev=0 ${{ steps.version.outputs.version }}^ 2>/dev/null || echo "")

                  if [ -z "$PREVIOUS_TAG" ]; then
                    echo "No previous tag found, including all commits"
                    COMMITS=$(git log --pretty=format:"- %s (%h)" --reverse)
                  else
                    echo "Generating changelog from $PREVIOUS_TAG to ${{ steps.version.outputs.version }}"
                    COMMITS=$(git log ${PREVIOUS_TAG}..${{ steps.version.outputs.version }} --pretty=format:"- %s (%h)" --reverse)
                  fi

                  # Format changelog
                  CHANGELOG="## What's Changed in ${{ env.PACKAGE_DISPLAY_NAME }} ${{ steps.version.outputs.version }}"
                  CHANGELOG="$CHANGELOG"$'\n\n'

                  # Group commits by type. Matches plain (fix:), scoped (fix(auth):),
                  # and breaking (fix!:, fix(auth)!:) Conventional Commits forms —
                  # a bare type: with no scope support silently drops scoped commits
                  # into "Other Changes".
                  SCOPE='(\([^)]*\))?!?'
                  FEATURES=$(echo "$COMMITS" | grep -iE "^- (feat|feature)${SCOPE}:" || true)
                  FIXES=$(echo "$COMMITS" | grep -iE "^- (fix|bugfix)${SCOPE}:" || true)
                  DOCS=$(echo "$COMMITS" | grep -iE "^- (docs|documentation)${SCOPE}:" || true)
                  STYLE=$(echo "$COMMITS" | grep -iE "^- (style|formatting)${SCOPE}:" || true)
                  REFACTOR=$(echo "$COMMITS" | grep -iE "^- (refactor|refactoring)${SCOPE}:" || true)
                  TEST=$(echo "$COMMITS" | grep -iE "^- (test|tests)${SCOPE}:" || true)
                  CHORE=$(echo "$COMMITS" | grep -iE "^- (chore|build|ci)${SCOPE}:" || true)
                  OTHER=$(echo "$COMMITS" | grep -ivE "^- (feat|feature|fix|bugfix|docs|documentation|style|formatting|refactor|refactoring|test|tests|chore|build|ci)${SCOPE}:" || true)

                  if [ -n "$FEATURES" ]; then
                    CHANGELOG="$CHANGELOG"$'\n'"### Features"$'\n'"$FEATURES"$'\n'
                  fi
                  if [ -n "$FIXES" ]; then
                    CHANGELOG="$CHANGELOG"$'\n'"### Bug Fixes"$'\n'"$FIXES"$'\n'
                  fi
                  if [ -n "$DOCS" ]; then
                    CHANGELOG="$CHANGELOG"$'\n'"### Documentation"$'\n'"$DOCS"$'\n'
                  fi
                  if [ -n "$REFACTOR" ]; then
                    CHANGELOG="$CHANGELOG"$'\n'"### Refactoring"$'\n'"$REFACTOR"$'\n'
                  fi
                  if [ -n "$TEST" ]; then
                    CHANGELOG="$CHANGELOG"$'\n'"### Tests"$'\n'"$TEST"$'\n'
                  fi
                  if [ -n "$CHORE" ]; then
                    CHANGELOG="$CHANGELOG"$'\n'"### Maintenance"$'\n'"$CHORE"$'\n'
                  fi
                  if [ -n "$OTHER" ]; then
                    CHANGELOG="$CHANGELOG"$'\n'"### Other Changes"$'\n'"$OTHER"$'\n'
                  fi

                  CHANGELOG="$CHANGELOG"$'\n'"**Full Changelog**: "
                  if [ -n "$PREVIOUS_TAG" ]; then
                    CHANGELOG="$CHANGELOG""https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${{ steps.version.outputs.version }}"
                  else
                    CHANGELOG="$CHANGELOG""https://github.com/${{ github.repository }}/commits/${{ steps.version.outputs.version }}"
                  fi

                  # Save to file for the release
                  echo "$CHANGELOG" > release_notes.md

            - name: Create release archive
              run: |
                  # Create a clean release directory
                  mkdir -p release-archive

                  # Copy all files except those that should be excluded
                  rsync -av \
                    --exclude='.git' \
                    --exclude='.github' \
                    --exclude='composer.lock' \
                    --exclude='release-archive' \
                    --exclude='release_notes.md' \
                    --exclude='node_modules' \
                    --exclude='.env' \
                    --exclude='tests' \
                    --exclude='docs' \
                    --exclude='examples' \
                    --exclude='build' \
                    --exclude='.vscode' \
                    --exclude='.idea' \
                    --exclude='*.log' \
                    --exclude='.DS_Store' \
                    --exclude='Thumbs.db' \
                    --exclude='.gitignore' \
                    --exclude='.gitattributes' \
                    --exclude='phpunit.xml*' \
                    --exclude='phpstan.neon*' \
                    --exclude='.phpcs.xml*' \
                    --exclude='Makefile' \
                    --exclude='*.md' \
                    . release-archive/

                  # Create zip archive
                  cd release-archive
                  zip -r ../${{ env.PACKAGE_NAME }}-${{ steps.version.outputs.version_number }}.zip .
                  cd ..
                  {
                    printf '# source-commit %s\n' "$(git rev-parse HEAD)"
                    unzip -Z1 "${{ env.PACKAGE_NAME }}-${{ steps.version.outputs.version_number }}.zip" | LC_ALL=C sort
                  } > "${{ env.PACKAGE_NAME }}-${{ steps.version.outputs.version_number }}.manifest.txt"
                  sha256sum "${{ env.PACKAGE_NAME }}-${{ steps.version.outputs.version_number }}.zip" > "${{ env.PACKAGE_NAME }}-${{ steps.version.outputs.version_number }}.zip.sha256"

            - name: Create GitHub Release
              uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844 # v1
              with:
                  tag_name: ${{ steps.version.outputs.version }}
                  name: ${{ steps.version.outputs.version }}
                  body_path: release_notes.md
                  draft: false
                  prerelease: ${{ inputs.prerelease }}
                  generate_release_notes: false
                  files: |
                      ${{ env.PACKAGE_NAME }}-${{ steps.version.outputs.version_number }}.zip
                      ${{ env.PACKAGE_NAME }}-${{ steps.version.outputs.version_number }}.manifest.txt
                      ${{ env.PACKAGE_NAME }}-${{ steps.version.outputs.version_number }}.zip.sha256
              env:
                  GITHUB_TOKEN: ${{ secrets.WORKFLOW_TOKEN || github.token }}

            - name: Update Composer index
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN }}
              run: |
                  if [ -z "$GH_TOKEN" ]; then
                    echo "POLARIS_PLUGIN_GITHUB_TOKEN not set; skipping Composer index update."
                    exit 0
                  fi
                  bash _builtnorth-github/.github/scripts/update-composer-index.sh \
                    "${{ env.COMPOSER_NAMESPACE }}" \
                    "${{ steps.version.outputs.version_number }}"

            - name: Release summary
              if: success()
              run: |
                  echo "Release created successfully!"
                  echo ""
                  echo "To use this version in other packages:"
                  echo ""
                  echo "    \"require\": {"
                  echo "        \"${{ env.COMPOSER_NAMESPACE }}\": \"${{ steps.version.outputs.version_number }}\""
                  echo "    }"
                  echo ""
                  echo "With VCS repository:"
                  echo "    \"repositories\": ["
                  echo "        {"
                  echo "            \"type\": \"vcs\","
                  echo "            \"url\": \"https://github.com/${{ github.repository }}\""
                  echo "        }"
                  echo "    ]"
