name: Reusable WordPress Plugin Release

on:
    workflow_call:
        inputs:
            version:
                description: "Release version (e.g., 1.2.0)"
                required: true
                type: string
            prerelease:
                description: "Is this a pre-release?"
                required: false
                type: boolean
                default: false
            php-versions:
                description: "PHP versions to test against in the pre-release CI gate"
                required: false
                type: string
                default: '["8.1", "8.2", "8.3", "8.4"]'
            wordpress-versions:
                description: "WordPress versions to test against in the pre-release CI gate"
                required: false
                type: string
                default: '["7.0", "latest"]'
            run-e2e:
                description: "Run Playwright e2e as part of the pre-release CI gate"
                required: false
                type: boolean
                default: false
            run-wp-taint:
                description: "Run wp-taint as part of the pre-release CI gate"
                required: false
                type: boolean
                default: false
            extra-plugins:
                description: "Space-separated plugin repos mapped into wp-env for PHP tests (see wp-plugin-ci.yml)"
                required: false
                type: string
                default: ""
            extra-phpunit-configs:
                description: "Space-separated extra PHPUnit configs run in the pre-release CI gate"
                required: false
                type: string
                default: ""
            e2e-plugins:
                description: "Space-separated plugin repos installed and activated for E2E (see wp-plugin-ci.yml)"
                required: false
                type: string
                default: ""
            sign-release:
                description: "Sign the release zip for siratik/license-manager updates (needs the release-signing environment and its RELEASE_SIGNING_KEY secret)"
                required: false
                type: boolean
                default: false
            signing-key-id:
                description: "Id of the release signing key; must match the public key built into the plugins"
                required: false
                type: string
                default: "releases-v1"
        secrets:
            ORG_REPO_TOKEN:
                required: false

concurrency:
    group: release-${{ github.repository }}${{ inputs.version == 'ci-only' && '-ci-only' || '' }}
    cancel-in-progress: false

jobs:
    preflight:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        outputs:
            already_released: ${{ steps.release.outputs.already_released }}
        steps:
            - name: Check release idempotency
              id: release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  VERSION="${{ inputs.version }}"
                  TAG="v${VERSION#v}"
                  if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
                    echo "already_released=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi
                  echo "already_released=false" >> "$GITHUB_OUTPUT"
                  if gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
                    echo "::error::Tag $TAG exists without a release. Resolve that partial release before retrying."
                    exit 1
                  fi

    ci:
        needs: preflight
        if: needs.preflight.outputs.already_released != 'true'
        uses: builtnorth/.github/.github/workflows/wp-plugin-ci.yml@main
        permissions:
            contents: read
            security-events: write
        with:
            php-versions: ${{ inputs.php-versions }}
            wordpress-versions: ${{ inputs.wordpress-versions }}
            run-e2e: ${{ inputs.run-e2e }}
            run-wp-taint: ${{ inputs.run-wp-taint }}
            extra-plugins: ${{ inputs.extra-plugins }}
            extra-phpunit-configs: ${{ inputs.extra-phpunit-configs }}
            e2e-plugins: ${{ inputs.e2e-plugins }}
        secrets:
            ORG_REPO_TOKEN: ${{ secrets.ORG_REPO_TOKEN }}

    build:
        needs: [preflight, ci]
        if: needs.preflight.outputs.already_released != 'true'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            # The sign job signs only a zip with this hash, never whatever is on the release.
            zip_sha256: ${{ steps.tag.outputs.zip_sha256 }}

        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  submodules: false
                  fetch-depth: 0

            - name: Get version from input
              id: version
              run: |
                  VERSION="${{ inputs.version }}"
                  # Pre-flight (ci-only): build at the version the plugin already declares.
                  if [ "$VERSION" = "ci-only" ]; then
                    VERSION=$(sed -nE 's/^[[:space:]]*\*?[[:space:]]*Version:[[:space:]]*([^[:space:]]+).*/\1/p' "${GITHUB_REPOSITORY##*/}.php" | head -1)
                    echo "Pre-flight: building at the declared version $VERSION."
                  fi
                  # Remove 'v' prefix if provided
                  VERSION="${VERSION#v}"
                  echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
                  echo "VERSION_TAG=v$VERSION" >> $GITHUB_OUTPUT
                  echo "PLUGIN_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_OUTPUT

            - name: Update plugin version
              run: |
                  # Update version in main plugin file
                  PLUGIN_FILE="${{ steps.version.outputs.PLUGIN_NAME }}.php"
                  sed -i "s/Version:\s*[0-9]\+\.[0-9]\+\.[0-9]\+/Version:           ${{ steps.version.outputs.VERSION }}/" $PLUGIN_FILE

                  # Update version constant if it exists
                  if grep -q "define.*VERSION" $PLUGIN_FILE; then
                      PLUGIN_CONST=$(echo "${{ steps.version.outputs.PLUGIN_NAME }}" | tr '[:lower:]' '[:upper:]' | tr '-' '_')
                      sed -i "s/define.*${PLUGIN_CONST}_VERSION.*['\"][0-9]\+\.[0-9]\+\.[0-9]\+['\"]/define('${PLUGIN_CONST}_VERSION', '${{ steps.version.outputs.VERSION }}'/" $PLUGIN_FILE
                  fi

                  # Update version in composer.json if it has one
                  if [ -f composer.json ] && grep -q '"version"' composer.json; then
                      jq '.version = "${{ steps.version.outputs.VERSION }}"' composer.json > composer.tmp.json
                      mv composer.tmp.json composer.json
                  fi

                  # Update version in package.json if it exists
                  if [ -f package.json ]; then
                      npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version --ignore-scripts
                  fi

            - name: Setup PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: "8.2"
                  tools: composer:v2

            - name: Configure Composer for private repos
              env:
                  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.ORG_REPO_TOKEN }}"}}'
              run: |
                  # Auth is configured via COMPOSER_AUTH env variable
                  echo "Composer auth configured via environment"

            - name: Checkout shared release scripts
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  repository: builtnorth/.github
                  ref: main
                  path: _builtnorth-github

            - name: Configure git for Composer VCS clones
              run: |
                  TOKEN="${{ secrets.ORG_REPO_TOKEN || github.token }}"
                  git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
                  git config --global url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"

            - name: Update composer.json for production
              env:
                  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.ORG_REPO_TOKEN }}"}}'
              run: |
                  # Derive VCS mirrors from this plugin's composer.json (no kitchen-sink).
                  bash _builtnorth-github/.github/scripts/configure-composer-vcs-repos.sh from-composer

                  # Remove the version field that causes warnings
                  composer config --unset version || true

            - name: Preserve committed builtnorth dependency constraints
              env:
                  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.ORG_REPO_TOKEN }}"}}'
              run: bash _builtnorth-github/.github/scripts/pin-builtnorth-composer-deps.sh prepare

            - name: Validate committed Composer constraints
              run: bash _builtnorth-github/.github/scripts/pin-builtnorth-composer-deps.sh validate

            - name: Finalize production dependency lock
              env:
                  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.ORG_REPO_TOKEN }}"}}'
              run: |
                  composer config optimize-autoloader true
                  composer config classmap-authoritative true
                  composer config prepend-autoloader true
                  composer update --no-dev --no-scripts --no-interaction --prefer-dist
                  echo "=== Resolved versions ==="
                  composer show --locked 2>/dev/null | grep builtnorth || true

            - name: Verify production Composer lock
              run: bash _builtnorth-github/.github/scripts/pin-builtnorth-composer-deps.sh verify

            - name: Commit finalized manifests and lock
              if: inputs.version != 'ci-only'
              run: |
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"

                  # Stamped PHP files are tracked: -u stages their changes only.
                  # Then one file at a time: a single `git add` with a missing or
                  # ignored path (no package-lock.json, a gitignored composer.lock)
                  # stages nothing, which tagged every release with the old version.
                  git add -u -- '*.php'
                  for f in composer.json composer.lock package.json package-lock.json; do
                    if [ -e "$f" ] && ! git check-ignore -q -- "$f"; then
                      git add -- "$f"
                    fi
                  done

                  # A stamped plugin file that did not get staged would tag stale source.
                  PLUGIN_FILE="${{ steps.version.outputs.PLUGIN_NAME }}.php"
                  if ! git diff --quiet -- "$PLUGIN_FILE"; then
                    echo "::error::$PLUGIN_FILE was stamped but not staged."
                    exit 1
                  fi

                  if ! git diff --cached --quiet; then
                    git commit -m "chore: prepare ${{ steps.version.outputs.VERSION_TAG }} release"
                    git push origin HEAD:${{ github.ref_name }}
                  fi

            - name: Install production dependencies from lock
              env:
                  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.ORG_REPO_TOKEN }}"}}'
              run: |
                  rm -rf vendor
                  composer install --no-dev --optimize-autoloader --classmap-authoritative --no-scripts --prefer-dist --no-interaction

            - name: Generate readme.txt
              run: |
                  # Run the readme generation script if it exists
                  if [ -f "bin/generate-readme.php" ]; then
                      php bin/generate-readme.php
                      echo "readme.txt generated successfully"
                  fi

            - name: Verify committed production artifacts
              run: |
                  if [ -d build ] && grep -RIl --include='*.js' --fixed-strings '// webpackBootstrap' build/; then
                    echo "::error::Committed build/ contains development webpack bundles. Run the local release prebuild, commit its production output, and retry."
                    exit 1
                  fi

            - name: Create plugin zip
              run: |
                  # Create a directory for the plugin
                  mkdir -p ${{ steps.version.outputs.PLUGIN_NAME }}

                  # Determine which directories and files to include
                  INCLUDE_DIRS=""
                  [ -d "build" ] && INCLUDE_DIRS="$INCLUDE_DIRS build"
                  [ -d "parts" ] && INCLUDE_DIRS="$INCLUDE_DIRS parts"
                  [ -d "lib" ] && INCLUDE_DIRS="$INCLUDE_DIRS lib"
                  [ -d "vendor" ] && INCLUDE_DIRS="$INCLUDE_DIRS vendor"
                  [ -d "inc" ] && INCLUDE_DIRS="$INCLUDE_DIRS inc"
                  [ -d "includes" ] && INCLUDE_DIRS="$INCLUDE_DIRS includes"
                  [ -d "assets" ] && INCLUDE_DIRS="$INCLUDE_DIRS assets"
                  [ -d "templates" ] && INCLUDE_DIRS="$INCLUDE_DIRS templates"
                  [ -d "languages" ] && INCLUDE_DIRS="$INCLUDE_DIRS languages"

                  # Copy only the production files we need
                  cp -r $INCLUDE_DIRS *.php composer.json composer.lock ${{ steps.version.outputs.PLUGIN_NAME }}/ 2>/dev/null || true
                  [ -f "README.md" ] && cp README.md ${{ steps.version.outputs.PLUGIN_NAME }}/
                  [ -f "readme.txt" ] && cp readme.txt ${{ steps.version.outputs.PLUGIN_NAME }}/
                  [ -f "LICENSE" ] && cp LICENSE ${{ steps.version.outputs.PLUGIN_NAME }}/

                  # The *.php glob above also catches dev tooling at the plugin root. The
                  # wp-taint scanner bootstrap runs top-level code with no ABSPATH guard and
                  # is only read by CI from the repo checkout, so it never ships.
                  rm -f ${{ steps.version.outputs.PLUGIN_NAME }}/wp-taint-bootstrap.php

                  # Defensive: dist installs (--prefer-dist above) shouldn't leave
                  # vendor/*/.git behind, but strip it if present — a stray .git
                  # dir previously bloated releases past raw.githubusercontent.com's
                  # size limit for the private Composer index's mirrored dist.
                  find ${{ steps.version.outputs.PLUGIN_NAME }}/vendor -type d -name ".git" -prune -exec rm -rf {} + 2>/dev/null || true

                  # Source maps are dev-only debugging artifacts. Strip them everywhere,
                  # vendor/ included: bundled packages (the framework's build/) ship them too.
                  find ${{ steps.version.outputs.PLUGIN_NAME }} -type f -name "*.map" -delete 2>/dev/null || true

                  # Third-party packages without export-ignore ship their test suites, and
                  # vendor/ sits in the webroot. Nothing is autoloaded from these paths.
                  # cssmin's gui/ is a standalone PHP page and cssmin is its CLI script.
                  if [ -d ${{ steps.version.outputs.PLUGIN_NAME }}/vendor ]; then
                    find ${{ steps.version.outputs.PLUGIN_NAME }}/vendor -mindepth 2 -type d \( -name tests -o -name test -o -name __tests__ \) -prune -print -exec rm -rf {} +
                    find ${{ steps.version.outputs.PLUGIN_NAME }}/vendor -mindepth 2 -type f \( -name 'phpunit.xml*' -o -name '*.test.js' \) -print -delete
                    rm -rf ${{ steps.version.outputs.PLUGIN_NAME }}/vendor/tubalmartin/cssmin/gui ${{ steps.version.outputs.PLUGIN_NAME }}/vendor/tubalmartin/cssmin/cssmin
                  fi

                  # Create the zip (src directory is not copied, so no need to exclude)
                  zip -r ${{ steps.version.outputs.PLUGIN_NAME }}.zip ${{ steps.version.outputs.PLUGIN_NAME }}/

                  # Scanner tooling must never ship: fail rather than publish it.
                  if unzip -Z1 ${{ steps.version.outputs.PLUGIN_NAME }}.zip | grep -E "^${{ steps.version.outputs.PLUGIN_NAME }}/wp-taint"; then
                    echo "::error::The release zip contains wp-taint scanner files (listed above). Exclude them in the Create plugin zip step."
                    exit 1
                  fi

                  # Clean up
                  rm -rf ${{ steps.version.outputs.PLUGIN_NAME }}

                  echo "Plugin zip created:"
                  ls -la *.zip

            - name: Generate release notes
              id: release_notes
              run: |
                  CURRENT="${{ steps.version.outputs.VERSION_TAG }}"
                  PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vxF "$CURRENT" | sed -n '1p' || true)

                  if [ -z "$PREVIOUS_TAG" ]; then
                      echo "No previous tag found, this is the first release"
                      PREVIOUS_TAG=$(git rev-list --max-parents=0 HEAD)
                  fi

                  echo "Comparing changes from $PREVIOUS_TAG to HEAD ($CURRENT)"

                  COMMITS=$(git log --pretty=format:"- %s (%h)" "$PREVIOUS_TAG"..HEAD | grep -v "Merge branch" || true)
                  # Backtick @name / @scope/pkg so GitHub never turns them into user mentions (it lists mentioned users as release contributors).
                  COMMITS=$(printf '%s\n' "$COMMITS" | sed -E 's/(^|[^`[:alnum:]])(@[[:alnum:]_.-]+(\/[[:alnum:]_.-]+)?)/\1`\2`/g')

                  # Group commits by type. Matches plain (fix:), scoped (fix(auth):),
                  # and breaking (fix!:, fix(auth)!:) Conventional Commits forms —
                  # a bare type: with no scope support silently drops scoped commits
                  # into "Other Changes".
                  SCOPE='(\([^)]*\))?!?'
                  FEATURES=$(echo "$COMMITS" | grep -iE "^- (feat|feature)${SCOPE}:" || true)
                  FIXES=$(echo "$COMMITS" | grep -iE "^- (fix|bugfix)${SCOPE}:" || true)
                  DOCS=$(echo "$COMMITS" | grep -iE "^- (docs|documentation)${SCOPE}:" || true)
                  REFACTOR=$(echo "$COMMITS" | grep -iE "^- (refactor|refactoring)${SCOPE}:" || true)
                  TEST=$(echo "$COMMITS" | grep -iE "^- (test|tests)${SCOPE}:" || true)
                  CHORE=$(echo "$COMMITS" | grep -iE "^- (chore|build|ci)${SCOPE}:" || true)
                  OTHER=$(echo "$COMMITS" | grep -ivE "^- (feat|feature|fix|bugfix|docs|documentation|refactor|refactoring|test|tests|chore|build|ci)${SCOPE}:" || true)

                  # Build changelog
                  CHANGELOG="## What's Changed in ${{ steps.version.outputs.PLUGIN_NAME }} ${{ steps.version.outputs.VERSION_TAG }}"$'\n\n'
                  if [ -n "$FEATURES" ]; then
                    CHANGELOG="${CHANGELOG}### Features"$'\n'"${FEATURES}"$'\n\n'
                  fi
                  if [ -n "$FIXES" ]; then
                    CHANGELOG="${CHANGELOG}### Bug Fixes"$'\n'"${FIXES}"$'\n\n'
                  fi
                  if [ -n "$DOCS" ]; then
                    CHANGELOG="${CHANGELOG}### Documentation"$'\n'"${DOCS}"$'\n\n'
                  fi
                  if [ -n "$REFACTOR" ]; then
                    CHANGELOG="${CHANGELOG}### Refactoring"$'\n'"${REFACTOR}"$'\n\n'
                  fi
                  if [ -n "$TEST" ]; then
                    CHANGELOG="${CHANGELOG}### Tests"$'\n'"${TEST}"$'\n\n'
                  fi
                  if [ -n "$CHORE" ]; then
                    CHANGELOG="${CHANGELOG}### Maintenance"$'\n'"${CHORE}"$'\n\n'
                  fi
                  if [ -n "$OTHER" ]; then
                    CHANGELOG="${CHANGELOG}### Other Changes"$'\n'"${OTHER}"$'\n\n'
                  fi
                  if [ -z "$COMMITS" ]; then
                    CHANGELOG="${CHANGELOG}No changes recorded since ${PREVIOUS_TAG}."$'\n\n'
                  fi

                  CHANGELOG="${CHANGELOG}**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREVIOUS_TAG}...${{ steps.version.outputs.VERSION_TAG }}"

                  # Save to output
                  echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> $GITHUB_OUTPUT

                  # Use EOF to handle multiline output
                  echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
                  echo "$CHANGELOG" >> $GITHUB_OUTPUT
                  echo "EOF" >> $GITHUB_OUTPUT

            - name: Update CHANGELOG.md
              run: |
                  # Update CHANGELOG.md with the new version
                  if [ -f CHANGELOG.md ]; then
                      # Get today's date
                      TODAY=$(date +"%Y-%m-%d")
                      
                      # Replace [Unreleased] with the new version
                      sed -i "s/## \[Unreleased\]/## [${{ steps.version.outputs.VERSION }}] - $TODAY/" CHANGELOG.md
                      
                      # Add new [Unreleased] section at the top
                      sed -i "/^## \[${{ steps.version.outputs.VERSION }}\]/i\\## [Unreleased]\\n" CHANGELOG.md
                      
                  fi

            - name: Commit finalized release source
              if: inputs.version != 'ci-only'
              run: |
                  git config --local user.email "action@github.com"
                  git config --local user.name "GitHub Action"
                  for f in readme.txt CHANGELOG.md; do
                    if [ -e "$f" ] && ! git check-ignore -q -- "$f"; then
                      git add -- "$f"
                    fi
                  done
                  if ! git diff --cached --quiet; then
                    git commit -m "docs: finalize ${{ steps.version.outputs.VERSION_TAG }} release files"
                    git push origin HEAD:${{ github.ref_name }}
                  fi

            - name: Create exact-source tag
              id: tag
              if: inputs.version != 'ci-only'
              run: |
                  TAG="${{ steps.version.outputs.VERSION_TAG }}"
                  git fetch origin "refs/tags/$TAG:refs/tags/$TAG" 2>/dev/null || true
                  if git rev-parse "$TAG" >/dev/null 2>&1; then
                    if [ "$(git rev-list -n1 "$TAG")" != "$(git rev-parse HEAD)" ]; then
                      echo "::error::Tag $TAG already exists but does not point to finalized HEAD."
                      exit 1
                    fi
                    echo "Tag $TAG already points to finalized HEAD."
                  else
                    git tag -a "$TAG" -m "Release $TAG"
                    git push origin "$TAG"
                  fi

                  {
                    printf '# source-commit %s\n' "$(git rev-parse HEAD)"
                    unzip -Z1 "${{ steps.version.outputs.PLUGIN_NAME }}.zip" | LC_ALL=C sort
                  } > "${{ steps.version.outputs.PLUGIN_NAME }}.manifest.txt"
                  sha256sum "${{ steps.version.outputs.PLUGIN_NAME }}.zip" > "${{ steps.version.outputs.PLUGIN_NAME }}.zip.sha256"
                  ZIP_SHA256="$(cut -d' ' -f1 "${{ steps.version.outputs.PLUGIN_NAME }}.zip.sha256")"
                  echo "zip_sha256=$ZIP_SHA256" >> "$GITHUB_OUTPUT"
                  echo "Release zip SHA-256: $ZIP_SHA256 (the sign job signs only a zip with this hash)"

            # Use github.token here so release creation is not tied to ORG_REPO_TOKEN
            # (Composer/checkout still use that PAT for private builtnorth/* VCS). A PAT without
            # Contents: write on this repo causes gh release create to return HTTP 403.
            - name: Create Release with GitHub CLI
              if: inputs.version != 'ci-only'
              env:
                  GITHUB_TOKEN: ${{ github.token }}
                  # Passed as env, never pasted into the script: commit messages are
                  # untrusted text, and a backtick or $(...) in one would run as a command.
                  CHANGELOG: ${{ steps.release_notes.outputs.CHANGELOG }}
              run: |
                  if gh release view "${{ steps.version.outputs.VERSION_TAG }}" >/dev/null 2>&1; then
                    echo "Release ${{ steps.version.outputs.VERSION_TAG }} already exists; nothing to publish."
                    exit 0
                  fi

                  PRERELEASE_FLAG=""
                  if [ "${{ inputs.prerelease }}" = "true" ]; then
                      PRERELEASE_FLAG="--prerelease"
                  fi

                  printf '%s\n' "$CHANGELOG" > release_notes.md

                  gh release create "${{ steps.version.outputs.VERSION_TAG }}" \
                    --title "${{ steps.version.outputs.VERSION_TAG }}" \
                    --notes-file release_notes.md \
                    $PRERELEASE_FLAG \
                    ${{ steps.version.outputs.PLUGIN_NAME }}.zip \
                    ${{ steps.version.outputs.PLUGIN_NAME }}.manifest.txt \
                    ${{ steps.version.outputs.PLUGIN_NAME }}.zip.sha256

            - name: Refresh Composer plugin index
              if: inputs.version != 'ci-only'
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.ORG_REPO_TOKEN }}
              run: |
                  if [ -z "$GH_TOKEN" ]; then
                    echo "ORG_REPO_TOKEN not set; skip composer index"
                    exit 0
                  fi
                  gh api --method POST repos/builtnorth/registry/dispatches --input - <<EOF
                  {"event_type":"plugin-released","client_payload":{"plugin":"${{ steps.version.outputs.PLUGIN_NAME }}","version":"${{ steps.version.outputs.VERSION }}"}}
                  EOF

    # Signs the published zip so siratik/license-manager installs it. A separate job so the
    # signing key never shares a runner with composer install or the build. The
    # release-signing environment (in the plugin repo) holds RELEASE_SIGNING_KEY as an
    # environment secret (never a repo or org secret, which would skip the reviewer) and
    # requires a reviewer: the job waits for that approval. It signs only a zip whose hash
    # matches what the build job made, so a release asset swapped during the wait is
    # refused. If approval is declined or anything fails, the release stays unsigned and
    # sites show the update but don't install it. Only a release dispatched from main is
    # signed (release.mjs dispatches plugins there): code on any other branch never gets a
    # signature, whatever the environment's settings.
    sign:
        needs: build
        if: inputs.sign-release && inputs.version != 'ci-only' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        environment: release-signing
        permissions:
            contents: write
        env:
            INPUT_VERSION: ${{ inputs.version }}
            KEY_ID: ${{ inputs.signing-key-id }}
            EXPECTED_SHA256: ${{ needs.build.outputs.zip_sha256 }}
        steps:
            - name: Checkout shared release scripts
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  repository: builtnorth/.github
                  ref: main
                  path: _builtnorth-github
                  persist-credentials: false

            # No setup action in this job: anything run here could read the token or put its
            # own sha256sum/php on PATH. The runner's preinstalled PHP has sodium, and the
            # script refuses to run without it.
            - name: Download the published zip and check it is the one the build made
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  VERSION="${INPUT_VERSION#v}"
                  NAME="${GITHUB_REPOSITORY##*/}"
                  # Checked before anything reaches GITHUB_ENV: a newline here would set other variables.
                  if ! [[ "$VERSION" =~ ^[0-9][0-9A-Za-z.-]*$ ]] || ! [[ "$NAME" =~ ^[a-z0-9][a-z0-9_-]*$ ]]; then
                    echo "::error::Unexpected version or repository name."
                    exit 1
                  fi
                  if ! [[ "$EXPECTED_SHA256" =~ ^[0-9a-f]{64}$ ]]; then
                    echo "::error::The build job did not report the zip's hash."
                    exit 1
                  fi
                  gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "$NAME.zip"
                  ACTUAL_SHA256="$(sha256sum "$NAME.zip" | cut -d' ' -f1)"
                  echo "Zip SHA-256: $ACTUAL_SHA256 (build reported $EXPECTED_SHA256)"
                  if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
                    echo "::error::The zip on the release is not the one the build job made. Not signing."
                    exit 1
                  fi
                  echo "VERSION=$VERSION" >> "$GITHUB_ENV"
                  echo "NAME=$NAME" >> "$GITHUB_ENV"

            - name: Sign the zip
              env:
                  RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
              run: php _builtnorth-github/.github/scripts/sign-release.php "$NAME.zip" "$NAME" "$VERSION" "$KEY_ID" > "$NAME.zip.sig"

            # Ed25519 signatures are deterministic, so a re-run uploads the same file.
            - name: Upload the signature
              env:
                  GH_TOKEN: ${{ github.token }}
              run: gh release upload "v$VERSION" "$NAME.zip.sig" --repo "$GITHUB_REPOSITORY" --clobber
