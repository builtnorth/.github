name: E2E Playwright (opt-in)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: e2e-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright full-site smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress

      - name: Install npm dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Start wp-env
        run: npx wp-env start

      - name: Seed E2E fixtures
        env:
          E2E_SEED_APPLY_SITE_SETTINGS: '1'
        run: WP_CMD="npx wp-env run cli wp" bash bin/seed-e2e-fixtures.sh

      - name: Run Playwright
        env:
          CI: true
          WP_USERNAME: admin
          WP_PASSWORD: password
        run: npm run test:e2e

      - name: Upload artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: artifacts/
          if-no-files-found: ignore
