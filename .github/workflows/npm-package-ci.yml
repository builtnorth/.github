name: Reusable NPM Package CI

on:
  workflow_call:
    inputs:
      package-name:
        description: 'Package name (defaults to repository name)'
        required: false
        type: string
        default: ''
      node-versions:
        description: 'Node versions to test against'
        required: false
        type: string
        default: '["24"]'
      build-command:
        description: 'Build command'
        required: false
        type: string
        default: 'build'
      test-command:
        description: 'Test command'
        required: false
        type: string
        default: 'test'
      lint-command:
        description: 'Lint command'
        required: false
        type: string
        default: 'lint'
      type-check-command:
        description: 'Type check command'
        required: false
        type: string
        default: ''
      run-tests:
        description: 'Run tests'
        required: false
        type: boolean
        default: true
      run-lint:
        description: 'Run linting'
        required: false
        type: boolean
        default: true
      run-build:
        description: 'Run build'
        required: false
        type: boolean
        default: true
      run-type-check:
        description: 'Run type checking'
        required: false
        type: boolean
        default: false
      use-workspace:
        description: 'Use npm workspace setup'
        required: false
        type: boolean
        default: true
    secrets:
      ORG_REPO_TOKEN:
        required: false

env:
  PACKAGE_NAME: ${{ inputs.package-name || github.event.repository.name }}

jobs:
  # The only job that gets the org token: it checks out the private basecamp-dev
  # workspace and uploads it. The other jobs run npm and package code with no token.
  fetch:
    if: inputs.use-workspace
    name: Fetch workspace
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # A public repo's artifacts are public: uploading the workspace there would
      # publish the private basecamp-dev repo.
      - name: Refuse on a public repository
        if: ${{ !github.event.repository.private }}
        run: |
          echo "::error::use-workspace uploads the private basecamp-dev tree as an artifact; a public repository must set use-workspace: false."
          exit 1

      - name: Checkout parent repository for workspace
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.repository_owner }}/basecamp-dev
          path: workspace-root
          token: ${{ secrets.ORG_REPO_TOKEN || github.token }}
          persist-credentials: false

      - name: Drop git metadata
        run: rm -rf workspace-root/.git

      - name: Upload workspace
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-root-${{ env.PACKAGE_NAME }}
          path: workspace-root
          include-hidden-files: true
          retention-days: 5
          overwrite: true

  test:
    needs: fetch
    # fetch is skipped without a workspace; only its failure stops this job.
    if: ${{ !cancelled() && needs.fetch.result != 'failure' && inputs.run-tests }}
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ${{ fromJson(inputs.node-versions) }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # basecamp-dev is private; the fetch job checked it out. This job has no token.
      - name: Download parent repository for workspace
        if: inputs.use-workspace
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workspace-root-${{ env.PACKAGE_NAME }}
          path: workspace-root

      - name: Setup workspace
        if: inputs.use-workspace
        run: |
          # Copy this package into the workspace structure
          mkdir -p workspace-root/npm_packages
          rsync -av --exclude='workspace-root' --exclude='.git' . workspace-root/npm_packages/${{ env.PACKAGE_NAME }}/

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: |
          if [ "${{ inputs.use-workspace }}" = "true" ]; then
            cd workspace-root
          fi
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run tests
        run: |
          if [ "${{ inputs.use-workspace }}" = "true" ]; then
            cd workspace-root/npm_packages/${{ env.PACKAGE_NAME }}
          fi
          npm run ${{ inputs.test-command }}

  lint:
    needs: fetch
    # fetch is skipped without a workspace; only its failure stops this job.
    if: ${{ !cancelled() && needs.fetch.result != 'failure' && inputs.run-lint }}
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # basecamp-dev is private; the fetch job checked it out. This job has no token.
      - name: Download parent repository for workspace
        if: inputs.use-workspace
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workspace-root-${{ env.PACKAGE_NAME }}
          path: workspace-root

      - name: Setup workspace
        if: inputs.use-workspace
        run: |
          # Copy this package into the workspace structure
          mkdir -p workspace-root/npm_packages
          rsync -av --exclude='workspace-root' --exclude='.git' . workspace-root/npm_packages/${{ env.PACKAGE_NAME }}/

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          if [ "${{ inputs.use-workspace }}" = "true" ]; then
            cd workspace-root
          fi
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run linting
        run: |
          if [ "${{ inputs.use-workspace }}" = "true" ]; then
            cd workspace-root/npm_packages/${{ env.PACKAGE_NAME }}
          fi
          npm run ${{ inputs.lint-command }}

  type-check:
    needs: fetch
    # fetch is skipped without a workspace; only its failure stops this job.
    if: ${{ !cancelled() && needs.fetch.result != 'failure' && inputs.run-type-check && inputs.type-check-command != '' }}
    name: Type Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # basecamp-dev is private; the fetch job checked it out. This job has no token.
      - name: Download parent repository for workspace
        if: inputs.use-workspace
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workspace-root-${{ env.PACKAGE_NAME }}
          path: workspace-root

      - name: Setup workspace
        if: inputs.use-workspace
        run: |
          # Copy this package into the workspace structure
          mkdir -p workspace-root/npm_packages
          rsync -av --exclude='workspace-root' --exclude='.git' . workspace-root/npm_packages/${{ env.PACKAGE_NAME }}/

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          if [ "${{ inputs.use-workspace }}" = "true" ]; then
            cd workspace-root
          fi
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run type checking
        run: |
          if [ "${{ inputs.use-workspace }}" = "true" ]; then
            cd workspace-root/npm_packages/${{ env.PACKAGE_NAME }}
          fi
          npm run ${{ inputs.type-check-command }}

  build:
    needs: fetch
    # fetch is skipped without a workspace; only its failure stops this job.
    if: ${{ !cancelled() && needs.fetch.result != 'failure' && inputs.run-build }}
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # basecamp-dev is private; the fetch job checked it out. This job has no token.
      - name: Download parent repository for workspace
        if: inputs.use-workspace
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: workspace-root-${{ env.PACKAGE_NAME }}
          path: workspace-root

      - name: Setup workspace
        if: inputs.use-workspace
        run: |
          # Copy this package into the workspace structure
          mkdir -p workspace-root/npm_packages
          rsync -av --exclude='workspace-root' --exclude='.git' . workspace-root/npm_packages/${{ env.PACKAGE_NAME }}/

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: |
          if [ "${{ inputs.use-workspace }}" = "true" ]; then
            cd workspace-root
          fi
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build package
        run: |
          if [ "${{ inputs.use-workspace }}" = "true" ]; then
            cd workspace-root/npm_packages/${{ env.PACKAGE_NAME }}
          fi
          # Packages that ship source have no build script.
          npm run ${{ inputs.build-command }} --if-present

      - name: Check for uncommitted changes
        run: |
          # Ignore untracked files (e.g. package-lock.json created by npm install
          # when the package does not commit a lockfile). Fail only if tracked
          # source was modified by the build.
          if [ "${{ inputs.use-workspace }}" = "true" ]; then
            if [[ -n $(git -C "$GITHUB_WORKSPACE" status --porcelain -uno) ]]; then
              echo "Build process modified tracked files in package repo:"
              git -C "$GITHUB_WORKSPACE" status --porcelain -uno
              exit 1
            fi
          elif [[ -n $(git status --porcelain -uno) ]]; then
            echo "Build process modified tracked files:"
            git status --porcelain -uno
            exit 1
          fi

  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [fetch, test, lint, type-check, build]
    if: always()
    
    steps:
      - name: Check results
        run: |
          # Check each job result, accounting for skipped jobs
          SUCCESS=true

          if [ "${{ needs.fetch.result }}" != "success" ] && [ "${{ needs.fetch.result }}" != "skipped" ]; then
            echo "❌ Fetch workspace: ${{ needs.fetch.result }}"
            SUCCESS=false
          fi
          
          if [ "${{ needs.test.result }}" != "success" ] && [ "${{ needs.test.result }}" != "skipped" ]; then
            echo "❌ Tests: Failed"
            SUCCESS=false
          fi
          
          if [ "${{ needs.lint.result }}" != "success" ] && [ "${{ needs.lint.result }}" != "skipped" ]; then
            echo "❌ Lint: Failed"
            SUCCESS=false
          fi
          
          if [ "${{ needs.type-check.result }}" != "success" ] && [ "${{ needs.type-check.result }}" != "skipped" ]; then
            echo "❌ Type Check: Failed"
            SUCCESS=false
          fi
          
          if [ "${{ needs.build.result }}" != "success" ] && [ "${{ needs.build.result }}" != "skipped" ]; then
            echo "❌ Build: Failed"
            SUCCESS=false
          fi
          
          if [ "$SUCCESS" = "true" ]; then
            echo "✅ All checks passed!"
            exit 0
          else
            echo "Some checks failed!"
            exit 1
          fi