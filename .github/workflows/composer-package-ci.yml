name: Reusable Composer Package CI

on:
  workflow_call:
    inputs:
      package-name:
        description: 'Package name (defaults to repository name)'
        required: false
        type: string
        default: ''
      php-versions:
        description: 'PHP versions to test against'
        required: false
        type: string
        default: '["8.1", "8.2", "8.3", "8.4"]'
      run-coverage:
        description: 'Run code coverage'
        required: false
        type: boolean
        default: true
      run-phpcs:
        description: 'Run PHP CodeSniffer'
        required: false
        type: boolean
        default: true
      run-phpcompat:
        description: 'Run PHP Compatibility check'
        required: false
        type: boolean
        default: true
      run-security-check:
        description: 'Run security audit'
        required: false
        type: boolean
        default: true
      composer-repository-profile:
        description: "full = all Built North VCS mirrors; coding-standards-only = coding-standards only (avoids cloning unrelated private repos during composer update)"
        required: false
        type: string
        default: 'full'
      coverage-php-version:
        description: 'PHP version for coverage report'
        required: false
        type: string
        default: '8.3'
    secrets:
      POLARIS_PLUGIN_GITHUB_TOKEN:
        required: false

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJson(inputs.php-versions) }}
    
    name: PHP ${{ matrix.php-version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2
      
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      
      - name: Cache dependencies
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: ${{ runner.os }}-composer-
      
      - name: Validate composer.json
        run: composer validate --no-check-lock
      
      - name: Configure private repositories
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN || github.token }}"}}'
        run: |
          PROFILE="${{ inputs.composer-repository-profile }}"
          if [ "$PROFILE" = "coding-standards-only" ]; then
            composer config repositories.coding-standards vcs https://github.com/builtnorth/coding-standards.git
          else
            composer config repositories.polaris vcs https://github.com/builtnorth/polaris.git
            composer config repositories.polaris-ai vcs https://github.com/builtnorth/polaris-ai.git
            composer config repositories.job-dispatcher vcs https://github.com/builtnorth/job-dispatcher.git
            composer config repositories.instant-actions vcs https://github.com/builtnorth/instant-actions.git
            composer config repositories.wp-portability vcs https://github.com/builtnorth/wp-portability.git
            composer config repositories.polaris-integrations-lib vcs https://github.com/builtnorth/polaris-integrations-lib.git
            composer config repositories.wp-utility vcs https://github.com/builtnorth/wp-utility.git
            composer config repositories.wp-baseline vcs https://github.com/builtnorth/wp-baseline.git
            composer config repositories.wp-environment-indicator vcs https://github.com/builtnorth/wp-environment-indicator.git
            composer config repositories.extended-cpts-extras vcs https://github.com/builtnorth/extended-cpts-extras.git
            composer config repositories.wp-schema vcs https://github.com/builtnorth/wp-schema.git
            composer config repositories.wp-config vcs https://github.com/builtnorth/wp-config.git
            composer config repositories.coding-standards vcs https://github.com/builtnorth/coding-standards.git
            composer config repositories.php-ai-client vcs https://github.com/WordPress/php-ai-client.git
          fi

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN || github.token }}"}}'
        run: |
          if [ -f composer.lock ]; then
            composer install --prefer-dist --no-progress --no-interaction
          else
            composer update --prefer-dist --no-progress --no-interaction
          fi

      - name: Security check for vulnerabilities
        if: inputs.run-security-check
        run: composer audit --no-dev --locked --abandoned=report

      - name: Run PHPUnit tests
        run: composer test

  coverage:
    if: inputs.run-coverage
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.coverage-php-version }}
          coverage: xdebug
          tools: composer:v2

      - name: Configure private repositories
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN || github.token }}"}}'
        run: |
          PROFILE="${{ inputs.composer-repository-profile }}"
          if [ "$PROFILE" = "coding-standards-only" ]; then
            composer config repositories.coding-standards vcs https://github.com/builtnorth/coding-standards.git
          else
            composer config repositories.polaris vcs https://github.com/builtnorth/polaris.git
            composer config repositories.polaris-ai vcs https://github.com/builtnorth/polaris-ai.git
            composer config repositories.job-dispatcher vcs https://github.com/builtnorth/job-dispatcher.git
            composer config repositories.instant-actions vcs https://github.com/builtnorth/instant-actions.git
            composer config repositories.wp-portability vcs https://github.com/builtnorth/wp-portability.git
            composer config repositories.polaris-integrations-lib vcs https://github.com/builtnorth/polaris-integrations-lib.git
            composer config repositories.wp-utility vcs https://github.com/builtnorth/wp-utility.git
            composer config repositories.wp-baseline vcs https://github.com/builtnorth/wp-baseline.git
            composer config repositories.wp-environment-indicator vcs https://github.com/builtnorth/wp-environment-indicator.git
            composer config repositories.extended-cpts-extras vcs https://github.com/builtnorth/extended-cpts-extras.git
            composer config repositories.wp-schema vcs https://github.com/builtnorth/wp-schema.git
            composer config repositories.wp-config vcs https://github.com/builtnorth/wp-config.git
            composer config repositories.coding-standards vcs https://github.com/builtnorth/coding-standards.git
            composer config repositories.php-ai-client vcs https://github.com/WordPress/php-ai-client.git
          fi

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN || github.token }}"}}'
        run: |
          if [ -f composer.lock ]; then
            composer install --prefer-dist --no-progress --no-interaction
          else
            composer update --prefer-dist --no-progress --no-interaction
          fi

      - name: Run PHPUnit with coverage
        run: vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.coverage-php-version }}
          coverage: none
          tools: composer:v2

      - name: Configure private repositories
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN || github.token }}"}}'
        run: |
          PROFILE="${{ inputs.composer-repository-profile }}"
          if [ "$PROFILE" = "coding-standards-only" ]; then
            composer config repositories.coding-standards vcs https://github.com/builtnorth/coding-standards.git
          else
            composer config repositories.polaris vcs https://github.com/builtnorth/polaris.git
            composer config repositories.polaris-ai vcs https://github.com/builtnorth/polaris-ai.git
            composer config repositories.job-dispatcher vcs https://github.com/builtnorth/job-dispatcher.git
            composer config repositories.instant-actions vcs https://github.com/builtnorth/instant-actions.git
            composer config repositories.wp-portability vcs https://github.com/builtnorth/wp-portability.git
            composer config repositories.polaris-integrations-lib vcs https://github.com/builtnorth/polaris-integrations-lib.git
            composer config repositories.wp-utility vcs https://github.com/builtnorth/wp-utility.git
            composer config repositories.wp-baseline vcs https://github.com/builtnorth/wp-baseline.git
            composer config repositories.wp-environment-indicator vcs https://github.com/builtnorth/wp-environment-indicator.git
            composer config repositories.extended-cpts-extras vcs https://github.com/builtnorth/extended-cpts-extras.git
            composer config repositories.wp-schema vcs https://github.com/builtnorth/wp-schema.git
            composer config repositories.wp-config vcs https://github.com/builtnorth/wp-config.git
            composer config repositories.coding-standards vcs https://github.com/builtnorth/coding-standards.git
            composer config repositories.php-ai-client vcs https://github.com/WordPress/php-ai-client.git
          fi

      - name: Install dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.POLARIS_PLUGIN_GITHUB_TOKEN || github.token }}"}}'
        run: |
          if [ -f composer.lock ]; then
            composer install --prefer-dist --no-progress --no-interaction
          else
            composer update --prefer-dist --no-progress --no-interaction
          fi
      
      - name: Run PHPCS coding standards check
        if: inputs.run-phpcs
        run: composer lint
      
      - name: Check PHP compatibility
        if: inputs.run-phpcompat
        run: composer phpcompat

  test-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [test, coverage, code-quality]
    if: always()
    
    steps:
      - name: Check results
        run: |
          SUCCESS=true

          if [ "${{ needs.test.result }}" != "success" ] && [ "${{ needs.test.result }}" != "skipped" ]; then
            echo "❌ Tests: ${{ needs.test.result }}"
            SUCCESS=false
          fi

          if [ "${{ needs.coverage.result }}" != "success" ] && [ "${{ needs.coverage.result }}" != "skipped" ]; then
            echo "❌ Coverage: ${{ needs.coverage.result }}"
            SUCCESS=false
          fi

          if [ "${{ needs.code-quality.result }}" != "success" ] && [ "${{ needs.code-quality.result }}" != "skipped" ]; then
            echo "❌ Code Quality: ${{ needs.code-quality.result }}"
            SUCCESS=false
          fi

          if [ "$SUCCESS" = "true" ]; then
            echo "✅ All checks passed!"
            exit 0
          else
            exit 1
          fi
