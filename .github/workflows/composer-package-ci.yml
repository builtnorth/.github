name: Reusable Composer Package CI

on:
  workflow_call:
    inputs:
      package-name:
        description: 'Package name (defaults to repository name)'
        required: false
        type: string
        default: ''
      php-versions:
        description: 'PHP versions to test against'
        required: false
        type: string
        default: '["8.1", "8.2", "8.3", "8.4"]'
      run-coverage:
        description: 'Run code coverage'
        required: false
        type: boolean
        default: true
      run-phpcs:
        description: 'Run PHP CodeSniffer'
        required: false
        type: boolean
        default: true
      run-phpcompat:
        description: 'Run PHP Compatibility check'
        required: false
        type: boolean
        default: true
      run-security-check:
        description: 'Run security audit'
        required: false
        type: boolean
        default: true
      composer-repository-profile:
        description: "from-composer (default) = VCS repos derived from this package's composer.json; coding-standards-only; full = legacy kitchen-sink"
        required: false
        type: string
        default: 'from-composer'
      coverage-php-version:
        description: 'PHP version for coverage report'
        required: false
        type: string
        default: '8.3'
    secrets:
      ORG_REPO_TOKEN:
        required: false
      WORKFLOW_TOKEN:
        required: false

jobs:
  # The only job that gets the org token, and it runs first-party code only: checkout,
  # our scripts, the runner's own PHP and Composer (no plugins, no scripts), upload.
  # The other jobs run third-party code (Composer plugins and scripts, test tools) and
  # get the dependencies it fetched instead of the token.
  fetch:
    name: Fetch private dependencies
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Checkout shared Composer scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: builtnorth/.github
          ref: main
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false
          path: _builtnorth-github
          token: ${{ secrets.ORG_REPO_TOKEN || secrets.WORKFLOW_TOKEN || github.token }}
          persist-credentials: false

      # One lock per PHP version the jobs run on, as each would have resolved on its own.
      - name: Fetch Composer dependencies
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.ORG_REPO_TOKEN || secrets.WORKFLOW_TOKEN }}"}}'
          PROFILE: ${{ inputs.composer-repository-profile }}
          PHP_VERSIONS_JSON: ${{ inputs.php-versions }}
          COVERAGE_PHP: ${{ inputs.coverage-php-version }}
        run: |
          VERSIONS=$( { jq -r '.[]' <<< "$PHP_VERSIONS_JSON"; echo "$COVERAGE_PHP"; } | sort -uV | tr '\n' ' ')
          bash _builtnorth-github/.github/scripts/fetch-private-deps.sh "$RUNNER_TEMP/deps" "$PROFILE" "$VERSIONS"

      - name: Upload fetched dependencies
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deps-${{ inputs.package-name || github.event.repository.name }}
          path: ${{ runner.temp }}/deps
          # Long enough to re-run a failed job later. Artifacts of a public repo are
          # public: a public caller must depend on public packages only.
          retention-days: 5
          overwrite: true

  test:
    needs: fetch
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJson(inputs.php-versions) }}
    
    name: PHP ${{ matrix.php-version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: composer:v2
      
      - name: Validate composer.json
        run: composer validate --no-check-lock
      
      # Private packages come from the fetch job; this job has no token.
      - name: Download fetched dependencies
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deps-${{ inputs.package-name || github.event.repository.name }}
          path: ${{ runner.temp }}/deps

      - name: Install dependencies
        env:
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/deps/cache
          PHP_VERSION: ${{ matrix.php-version }}
        run: |
          # The committed lock, else the one resolved for this PHP version, else the shared one.
          if [ ! -f composer.lock ]; then
            if [ -f "$RUNNER_TEMP/deps/locks/$PHP_VERSION.lock" ]; then
              cp "$RUNNER_TEMP/deps/locks/$PHP_VERSION.lock" composer.lock
            else
              cp "$RUNNER_TEMP/deps/composer.lock" composer.lock
            fi
          fi
          composer install --prefer-dist --no-progress --no-interaction

      - name: Security check for vulnerabilities
        if: inputs.run-security-check
        run: |
          PROD_PKGS=$(jq -r '
            (.require // {})
            | keys
            | map(select(. != "php" and (startswith("ext-") | not) and (startswith("composer-plugin-api") | not)))
            | length
          ' composer.json)
          if [ "$PROD_PKGS" = "0" ]; then
            echo "No production Composer packages to audit."
            exit 0
          fi
          composer audit --no-dev --locked --abandoned=report

      - name: Run PHPUnit tests
        run: composer test

  coverage:
    if: inputs.run-coverage
    name: Code Coverage
    runs-on: ubuntu-latest
    needs: fetch

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.coverage-php-version }}
          coverage: xdebug
          tools: composer:v2

      # Private packages come from the fetch job; this job has no token.
      - name: Download fetched dependencies
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deps-${{ inputs.package-name || github.event.repository.name }}
          path: ${{ runner.temp }}/deps

      - name: Install dependencies
        env:
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/deps/cache
          PHP_VERSION: ${{ inputs.coverage-php-version }}
        run: |
          # The committed lock, else the one resolved for this PHP version, else the shared one.
          if [ ! -f composer.lock ]; then
            if [ -f "$RUNNER_TEMP/deps/locks/$PHP_VERSION.lock" ]; then
              cp "$RUNNER_TEMP/deps/locks/$PHP_VERSION.lock" composer.lock
            else
              cp "$RUNNER_TEMP/deps/composer.lock" composer.lock
            fi
          fi
          composer install --prefer-dist --no-progress --no-interaction

      - name: Run PHPUnit with coverage
        # Through the package's test script, so flags it needs (e.g. --prepend) apply.
        run: composer test -- --coverage-text --coverage-clover=coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@ab904c41d6ece82784817410c45d8b8c02684457 # v3
        with:
          file: ./coverage.xml
          flags: unittests
          fail_ci_if_error: false

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: fetch

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ inputs.coverage-php-version }}
          coverage: none
          tools: composer:v2

      # Private packages come from the fetch job; this job has no token.
      - name: Download fetched dependencies
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: deps-${{ inputs.package-name || github.event.repository.name }}
          path: ${{ runner.temp }}/deps

      - name: Install dependencies
        env:
          COMPOSER_CACHE_DIR: ${{ runner.temp }}/deps/cache
          PHP_VERSION: ${{ inputs.coverage-php-version }}
        run: |
          # The committed lock, else the one resolved for this PHP version, else the shared one.
          if [ ! -f composer.lock ]; then
            if [ -f "$RUNNER_TEMP/deps/locks/$PHP_VERSION.lock" ]; then
              cp "$RUNNER_TEMP/deps/locks/$PHP_VERSION.lock" composer.lock
            else
              cp "$RUNNER_TEMP/deps/composer.lock" composer.lock
            fi
          fi
          composer install --prefer-dist --no-progress --no-interaction
      
      - name: Run PHPCS coding standards check
        if: inputs.run-phpcs
        run: composer lint
      
      - name: Check PHP compatibility
        if: inputs.run-phpcompat
        run: composer phpcompat

  test-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [fetch, test, coverage, code-quality]
    if: always()
    
    steps:
      - name: Check results
        run: |
          SUCCESS=true

          # Every other job needs fetch: when it fails they are skipped, not passed.
          if [ "${{ needs.fetch.result }}" != "success" ]; then
            echo "❌ Fetch private dependencies: ${{ needs.fetch.result }}"
            SUCCESS=false
          fi

          if [ "${{ needs.test.result }}" != "success" ] && [ "${{ needs.test.result }}" != "skipped" ]; then
            echo "❌ Tests: ${{ needs.test.result }}"
            SUCCESS=false
          fi

          if [ "${{ needs.coverage.result }}" != "success" ] && [ "${{ needs.coverage.result }}" != "skipped" ]; then
            echo "❌ Coverage: ${{ needs.coverage.result }}"
            SUCCESS=false
          fi

          if [ "${{ needs.code-quality.result }}" != "success" ] && [ "${{ needs.code-quality.result }}" != "skipped" ]; then
            echo "❌ Code Quality: ${{ needs.code-quality.result }}"
            SUCCESS=false
          fi

          if [ "$SUCCESS" = "true" ]; then
            echo "✅ All checks passed!"
            exit 0
          else
            exit 1
          fi
